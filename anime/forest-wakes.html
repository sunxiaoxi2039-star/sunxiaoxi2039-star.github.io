<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Forest Wakes</title>
<meta name="description" content="A hand-drawn style 2D anime short: an ancient forest guardian robot wakes at sunrise.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Georgia",serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;image-rendering:auto}
  #film{box-shadow:0 0 80px rgba(0,0,0,.8)}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#e9dcc2;text-align:center}
  #ui .card{pointer-events:auto;cursor:pointer;opacity:1;transition:opacity .8s}
  #ui .card h1{font-weight:400;font-size:clamp(22px,4vw,46px);letter-spacing:.35em;margin:0 0 .4em}
  #ui .card p{font-size:clamp(11px,1.3vw,15px);letter-spacing:.3em;opacity:.7;margin:0}
  #ui.hidden .card{opacity:0}
  #bar{position:fixed;left:0;bottom:0;height:2px;background:rgba(233,220,194,.35);width:0;transition:width .3s}
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="1920" height="1080"></canvas></div>
<div id="ui"><div class="card"><h1>森の目覚め</h1><p id="msg">PAINTING BACKGROUNDS…</p></div></div>
<div id="bar"></div>
<script>
'use strict';

/* ───────────────────────── utilities ───────────────────────── */
const W=1920,H=1080,TAU=Math.PI*2;
const canvas=document.getElementById('film');
const ctx=canvas.getContext('2d',{alpha:false});

function RNG(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
let R=RNG(20261102);
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const rsign=()=>R()<0.5?-1:1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease={
  io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  i:t=>t*t*t,
  o:t=>1-Math.pow(1-t,3),
  io4:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  heavy:t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},
  back:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
};
// value noise
const PERM=new Uint8Array(512);{const p=[];for(let i=0;i<256;i++)p[i]=i;const r=RNG(99);for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)PERM[i]=p[i&255];}
function hash2(x,y){return PERM[(PERM[x&255]+y)&255]/255;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y);let fx=x-xi,fy=y-yi;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return lerp(lerp(a,b,fx),lerp(c,d,fx),fy);}
function fbm(x,y,o=4){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);n+=a;a*=.5;f*=2.07;}return s/n;}
function noise1(x){return vnoise(x,7.31);}
// colors: arrays [r,g,b]
const css=(c,a=1)=>a>=1?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function hsl(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return[(r+m)*255,(g+m)*255,(b+m)*255];}
function toHsl(c){const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return[h,s*100,l*100];}
function vary(c,dh=0,ds=0,dl=0){const [h,s,l]=toHsl(c);return hsl(h+rnd(-dh,dh),clamp(s+rnd(-ds,ds),0,100),clamp(l+rnd(-dl,dl),0,100));}
function shade(c,dl,ds=0,dh=0){const [h,s,l]=toHsl(c);return hsl(h+dh,clamp(s+ds,0,100),clamp(l+dl,0,100));}
const hex=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];
// canvases
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
// geometry
const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const scl=(a,s)=>[a[0]*s,a[1]*s];
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
// two-bone IK. root, target, l1, l2, bend (+1/-1) -> joint position
function ik(root,target,l1,l2,bend){let dx=target[0]-root[0],dy=target[1]-root[1];let d=Math.hypot(dx,dy);const mx=l1+l2-0.01;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}const mn=Math.abs(l1-l2)+0.01;if(d<mn){d=mn;}
  const a=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));const base=Math.atan2(dy,dx);const ang=base-bend*a;return[root[0]+Math.cos(ang)*l1,root[1]+Math.sin(ang)*l1];}
// path from points; pts: [[x,y],[x,y,r?]...]  r = corner radius (rounded corner)
function roundPath(pts,closed=true){const out=[];const n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],r=p[2]||0;if(!r||(!closed&&(i===0||i===n-1))){out.push([p[0],p[1]]);continue;}
    const a=pts[(i-1+n)%n],b=pts[(i+1)%n];const v1=[a[0]-p[0],a[1]-p[1]],v2=[b[0]-p[0],b[1]-p[1]];const l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    const rr=Math.min(r,l1*0.48,l2*0.48);const u1=[v1[0]/l1,v1[1]/l1],u2=[v2[0]/l2,v2[1]/l2];
    const p1=[p[0]+u1[0]*rr,p[1]+u1[1]*rr],p2=[p[0]+u2[0]*rr,p[1]+u2[1]*rr];
    const segs=Math.max(3,Math.ceil(rr/2.5));for(let k=0;k<=segs;k++){const t=k/segs;const q=[(1-t)*(1-t)*p1[0]+2*(1-t)*t*p[0]+t*t*p2[0],(1-t)*(1-t)*p1[1]+2*(1-t)*t*p[1]+t*t*p2[1]];out.push(q);}
  }return out;}
function ellipsePts(cx,cy,rx,ry,n=28,a0=0,a1=TAU,rotA=0){const o=[];for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(n-1||1);const x=Math.cos(a)*rx,y=Math.sin(a)*ry;const [X,Y]=rot(x,y,rotA);o.push([cx+X,cy+Y]);}return o;}
function tracePath(c,pts,dx=0,dy=0){c.beginPath();c.moveTo(pts[0][0]+dx,pts[0][1]+dy);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0]+dx,pts[i][1]+dy);c.closePath();}
function bez(p0,p1,p2,p3,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]);}return o;}
function catmull(pts,n=6,closed=false){const o=[];const N=pts.length;const get=i=>pts[closed?((i%N)+N)%N:clamp(i,0,N-1)];const segs=closed?N:N-1;
  for(let i=0;i<segs;i++){const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
    o.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
  if(!closed)o.push(get(N-1));return o;}

/* ───────────────────────── painter (gouache backgrounds) ───────────────────────── */
// smooth rough brush dab (rounded blob)
function dab(c,x,y,rx,ry,rotA,color,alpha=1,rough=.18,n=9){
  const ca=Math.cos(rotA),sa=Math.sin(rotA);const P=[];
  for(let i=0;i<n;i++){const a=i/n*TAU;const r=1+(R()-.5)*rough*2;const px=Math.cos(a)*rx*r,py=Math.sin(a)*ry*r;P.push([x+px*ca-py*sa,y+px*sa+py*ca]);}
  c.beginPath();let m=[(P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2];c.moveTo(m[0],m[1]);
  for(let i=0;i<n;i++){const q=P[(i+1)%n];const mm=[(P[i][0]+q[0])/2,(P[i][1]+q[1])/2];c.quadraticCurveTo(P[i][0],P[i][1],mm[0],mm[1]);}
  c.closePath();c.fillStyle=css(color,alpha);c.fill();}
// leaf-like flick (pointed)
function flick(c,x,y,len,wid,ang,color,alpha=1){const ca=Math.cos(ang),sa=Math.sin(ang);c.beginPath();
  const p=(u,v)=>[x+u*ca-v*sa,y+u*sa+v*ca];const a=p(-len/2,0),b=p(len/2,0),c1=p(0,-wid),c2=p(0,wid);
  c.moveTo(a[0],a[1]);c.quadraticCurveTo(c1[0],c1[1],b[0],b[1]);c.quadraticCurveTo(c2[0],c2[1],a[0],a[1]);c.closePath();c.fillStyle=css(color,alpha);c.fill();}
// textured stroke along a line: series of dabs
function brush(c,x0,y0,x1,y1,w,color,alpha=.6,spacing=.45,rough=.2){
  const d=Math.hypot(x1-x0,y1-y0);const n=Math.max(2,Math.ceil(d/(w*spacing)));const ang=Math.atan2(y1-y0,x1-x0);
  for(let i=0;i<=n;i++){const t=i/n;const x=lerp(x0,x1,t)+rnd(-w*.1,w*.1),y=lerp(y0,y1,t)+rnd(-w*.1,w*.1);
    dab(c,x,y,w*rnd(.6,.8),w*rnd(.36,.5),ang+rnd(-.2,.2),vary(color,2,3,2),alpha*rnd(.7,1),rough,8);}}
// paper / gouache texture canvas (grey around 128)
function makePaper(w,h){
  const half=mkCanvas(w>>1,h>>1);const hc=half.getContext('2d');const id=hc.createImageData(half.width,half.height);const d=id.data;
  for(let y=0;y<half.height;y++)for(let x=0;x<half.width;x++){const i=(y*half.width+x)*4;
    const f=fbm(x*0.012,y*0.012,3)-.5;const g=fbm(x*0.05+100,y*0.05,2)-.5;const v=128+f*64+g*34;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  hc.putImageData(id,0,0);
  const full=mkCanvas(w,h);const fc=full.getContext('2d');fc.drawImage(half,0,0,w,h);
  const id2=fc.getImageData(0,0,w,h);const d2=id2.data;const r=RNG(5);
  for(let i=0;i<d2.length;i+=4){const n=(r()-.5)*30;d2[i]+=n;d2[i+1]+=n;d2[i+2]+=n;}
  fc.putImageData(id2,0,0);return full;}
let PAPER=null;
function applyPaper(c,alpha=.3){if(!PAPER)PAPER=makePaper(W+2*M,H+2*M);c.save();c.globalCompositeOperation='overlay';c.globalAlpha=alpha;c.drawImage(PAPER,-M,-M);c.restore();}

// foliage palettes: {dk, sh, mid, lt, hi}
function folPal(hue,sat,lit,warm=0){
  const w=[250,226,150];
  return {dk:hsl(hue+14,sat-4,lit-20),sh:hsl(hue+8,sat-2,lit-11),mid:hsl(hue,sat,lit),lt:mix(hsl(hue-8,sat+4,lit+11),w,warm*.25),hi:mix(hsl(hue-16,sat+6,lit+22),w,warm*.5)};}
function fogPal(p,fog,k){const o={};for(const key in p)o[key]=mix(p[key],fog,k);return o;}
// a foliage mass built from irregular lobes. detail 0..1 ; light from upper-right by default
function clump(c,cx,cy,r,pal,detail=1,ld=[.65,-.75],flat=0){
  const ry=r*(1-flat*.45);const K=3+Math.round(detail*4);const lobes=[];
  for(let i=0;i<K;i++){const a=rnd(TAU);const d=rnd(0,.5);lobes.push([cx+Math.cos(a)*d*r,cy+Math.sin(a)*d*ry,r*rnd(.42,.72),ry*rnd(.36,.66),rnd(-.5,.5)]);}
  lobes.forEach(l=>dab(c,l[0],l[1],l[2],l[3],l[4],vary(pal.sh,3,2,1.5),1,.24,14));
  lobes.forEach(l=>{if(R()<.7)dab(c,l[0]-ld[0]*l[2]*.3,l[1]-ld[1]*l[3]*.35,l[2]*.72,l[3]*.66,l[4],vary(pal.dk,3,2,2),.9,.26,12);});
  lobes.forEach(l=>dab(c,l[0]+ld[0]*l[2]*.2,l[1]+ld[1]*l[3]*.2,l[2]*.76,l[3]*.7,l[4],vary(pal.mid,4,3,2.5),.96,.3,16));
  lobes.forEach(l=>{if(R()<.85)dab(c,l[0]+ld[0]*l[2]*.45,l[1]+ld[1]*l[3]*.45,l[2]*.5,l[3]*.46,l[4],vary(pal.lt,4,3,2.5),.95,.32,14);});
  lobes.forEach(l=>{if(R()<.6)dab(c,l[0]+ld[0]*l[2]*.62,l[1]+ld[1]*l[3]*.62,l[2]*.26,l[3]*.24,l[4],vary(pal.hi,4,3,2.5),.9,.35,10);});
  if(detail>.45){const nF=Math.round(r*.3*detail);for(let i=0;i<nF;i++){const l=lobes[Math.floor(R()*K)];const a=rnd(TAU);const rr=rnd(.8,1.08);
    const litness=(Math.cos(a)*ld[0]+Math.sin(a)*ld[1]);const tone=litness>.35?pal.hi:litness>-.1?pal.lt:litness>-.5?pal.mid:pal.sh;
    flick(c,l[0]+Math.cos(a)*l[2]*rr,l[1]+Math.sin(a)*l[3]*rr,r*rnd(.1,.2),r*rnd(.025,.05),a+rnd(-.5,.5),vary(tone,5,4,3),.9);}}
}
// conifer bough (drooping)
function bough(c,x,y,len,side,pal,detail){const ang=side*.42+rnd(-.08,.08);const cx=x+side*len*.5,cy=y+len*.18;
  dab(c,cx,cy+len*.04,len*.55,len*.16,ang,vary(pal.sh,3,2,2),1,.3,14);
  dab(c,cx-side*len*.03,cy-len*.05,len*.5,len*.13,ang,vary(side>0?pal.lt:pal.mid,4,3,2.5),.95,.34,14);
  if(side>0||R()<.4)dab(c,cx+side*len*.1,cy-len*.1,len*.28,len*.07,ang,vary(pal.hi,4,3,2.5),.9,.36,10);
  if(detail>.5){const n=Math.round(len*.12*detail);for(let i=0;i<n;i++){const t=rnd(.3,1.05);flick(c,x+side*len*t,y+len*.18*t+rnd(-len*.1,len*.12),len*.12,len*.02,ang+rnd(-.9,.9)+ (R()<.5?Math.PI/2:0),vary(R()<.5?pal.mid:pal.lt,4,4,3),.9);}}}
// trunk: tapered, slightly curved. returns centre points
function trunk(c,x,y0,y1,w0,w1,lean,bark,barkSh,barkLt,detail=1,wob=.5){
  const pts=[];const n=12;for(let i=0;i<=n;i++){const t=i/n;const y=lerp(y0,y1,t);const w=lerp(w0,w1,t);const cx=x+lean*t*t*(y0-y1)+(vnoise(t*2.5,x*.013)-.5)*w*wob;pts.push([cx-w/2,y,cx+w/2,y]);}
  c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));for(let i=pts.length-1;i>=0;i--)c.lineTo(pts[i][2],pts[i][3]);c.closePath();c.fillStyle=css(bark);c.fill();
  if(detail>.3){
    // shadow side (left) and lit side (right)
    for(let i=0;i<n;i++){const p=pts[i],q=pts[i+1];const w=p[2]-p[0];brush(c,p[0]+w*.2,p[1],q[0]+w*.2,q[1],w*.3,barkSh,.55,.5,.15);brush(c,p[2]-w*.16,p[1],q[2]-w*.16,q[1],w*.22,barkLt,.5,.5,.15);}
    const m=Math.round((y0-y1)/16*detail);for(let i=0;i<m;i++){const t=rnd();const p=pts[Math.floor(t*n)];const w=p[2]-p[0];const sx=p[0]+rnd(.1,.9)*w;
      flick(c,sx,p[1]+rnd(-6,6),rnd(10,30),rnd(1,2.2),Math.PI/2+rnd(-.12,.12),R()<.7?barkSh:barkLt,.6);}
  }
  return pts;}
function barkCols(pal,fog,fogK){return [mix(shade(pal.sh,-16,-14,-85),fog,fogK),mix(shade(pal.dk,-14,-14,-85),fog,fogK),mix(shade(pal.mid,-6,-20,-80),fog,fogK)];}
// deciduous tree
function treeDec(c,x,baseY,h,pal,fog,fogK,detail,opt={}){
  const [bark,barkSh,barkLt]=barkCols(pal,fog,fogK);const p=fogPal(pal,fog,fogK);const lean=opt.lean!==undefined?opt.lean:rnd(-.1,.1);const topY=baseY-h*(opt.trunkFrac||.62);
  const w0=h*rnd(.05,.07)*(opt.thick||1);trunk(c,x,baseY,topY,w0,w0*.5,lean,bark,barkSh,barkLt,detail);
  const tx=x+lean*(baseY-topY);const crownR=h*rnd(.16,.21)*(opt.crown||1);
  const nb=opt.branches||4;const ends=[];
  for(let i=0;i<nb;i++){const a=-Math.PI/2+rnd(-1.2,1.2);const len=h*rnd(.1,.2);const sy=topY+rnd(0,h*.12);const ex=tx+Math.cos(a)*len,ey=sy+Math.sin(a)*len;
    c.strokeStyle=css(bark);c.lineWidth=w0*rnd(.22,.38);c.lineCap='round';c.beginPath();c.moveTo(tx,sy);c.quadraticCurveTo(tx+Math.cos(a)*len*.5+rnd(-8,8),sy+Math.sin(a)*len*.5,ex,ey);c.stroke();ends.push([ex,ey,len]);}
  const masses=[];ends.forEach(e=>masses.push([e[0],e[1]-e[2]*.05,crownR*rnd(.5,.75)]));
  masses.push([tx+rnd(-crownR*.2,crownR*.2),topY-crownR*.35,crownR*rnd(.95,1.15)]);
  masses.push([tx+crownR*.35,topY-crownR*.9,crownR*rnd(.5,.7)]);masses.push([tx-crownR*.4,topY-crownR*.5,crownR*rnd(.45,.65)]);
  masses.sort((a,b)=>(a[1]+a[2]*.3)-(b[1]+b[2]*.3)).reverse();
  masses.forEach(m=>clump(c,m[0],m[1],m[2],p,detail));
  if(opt.sparse)return; }
// conifer
function treeCon(c,x,baseY,h,pal,fog,fogK,detail,opt={}){
  const [bark,barkSh,barkLt]=barkCols(pal,fog,fogK);const p=fogPal(pal,fog,fogK);const topY=baseY-h;const lean=rnd(-.04,.04);
  const w0=h*rnd(.035,.05);trunk(c,x,baseY,topY+h*.1,w0,w0*.3,lean,bark,barkSh,barkLt,detail,.2);
  const tiers=Math.round(6+h/130);for(let i=tiers;i>=1;i--){const t=i/tiers;const y=topY+h*.08+Math.pow(t,1.15)*h*(opt.canopy||.8);const len=h*(.05+.17*t)*(opt.wide||1);

    if(t>=11.6&&t<13.4){const u=sstep(11.6,13.4,t);const a=U(-60,-80+u*95),b=U(60,-110+u*95);opt.clip=[b,a];}
    drawRobot(ctx,st.pose,{x:RX,y:RY,s:RS},opt);
    // vines falling off: leaf debris at the chest vine
    if(t>=27.5)debris(ctx,t,27.5,4,b=>{const s=solvePose(robotState(b).pose);return U(...add(s.hip,rot(-6,-26,s.ta)));},14,47,{kind:'leaf',size:5,vx:30,vy:10,life:2.4,floor:RY+30});
    drawMoundFront(ctx);
    shoulderBird(ctx,t,sp);
    // thruster ground dust / wind
    if(t>=37.2){windRing(ctx,RX+30,RY+10,t-37.2,1400,{flat:.28,half:1});debris(ctx,t,37.25,.6,U(0,0),60,48,{kind:'mix',size:6,vx:420,vy:160,life:2,g:200,spread:60});
      ambientLeaves(ctx,t,[RX-900,RY-500,RX+900,RY+300],40,49,{cycle:5,size:8,wind:140});}
    if(t>=41.1)debris(ctx,t,41.1,.5,U(0,0),50,50,{kind:'mix',size:6,vx:380,vy:220,life:2.2,g:220,spread:80});
    // ambient leaves (robot plane)
    ambientLeaves(ctx,t,[-200,-300,W+600,H+300],sh.id===1||sh.id===4||sh.id===6?28:10,51,{cycle:11,size:9,wind:12});
    ctx.restore();
    // flock of birds bursting from treetops (mid layer p=.55)
    if(t>=21.4){ctx.save();const p=.55;const z=1+(cam.z-1)*(0.45+0.55*p);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2-(cam.x-W/2)*p,-H/2-(cam.y-H/2)*p);
      flock(ctx,t,21.4,[[80,330],[300,300],[520,340],[760,320],[950,360],[1900,330],[2050,360],[-200,340]],46,52,{dur:1.6,size:11,dx:30});ctx.restore();}
    if(t>=37.3){ctx.save();const p=.55;const z=1+(cam.z-1)*(0.45+0.55*p);ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2-(cam.x-W/2)*p,-H/2-(cam.y-H/2)*p);
      flock(ctx,t,37.3,[[80,330],[400,310],[700,330],[1900,330],[2100,360]],30,53,{dur:1.0,size:11,dx:-20});ctx.restore();}
    // launch smear
    if(t>=41.3&&t<41.75){ctx.save();worldXf(cam);const a=t-41.3;const y0=RY-(50*RS)-(600*a*a+140*a)*RS;ctx.globalCompositeOperation='lighter';
      softBlob(ctx,RX+20,y0+380,90,520,[255,236,190],.75);softBlob(ctx,RX+20,y0+300,40,420,[255,250,230],.9);ctx.restore();}
  } else { // 'up' set: launch through the canopy
    ctx.save();worldXf(cam);const lt7=t-41.6;
    const P=[[1180+10,1300],[1050,900],[1280,560],[1180,430]];
    const prog=sstep(0,3.2,lt7);const fade=1-sstep(5.5,10.5,lt7);const head=trail(ctx,P,prog,fade,t);
    if(prog<1&&head){ // tiny silhouette robot climbing
      const u=prog;const sc=lerp(1.1,.08,ease.o(u));setLighting(1,0);
      const pose={hip:[0,0],torsoA:-6,headP:-30,headY:1,nearFoot:[-4,46],farFoot:[6,46],nearHand:[-12,16],farHand:[16,14],footA:[1.1,1.1]};
      drawRobot(ctx,pose,{x:head[0],y:head[1]+40*sc,s:sc},{sil:.85,lit:1,thr:1.6,eye:1,fr:Math.floor(t*12)});}
    // leaves spiraling down toward camera
    const r=RNG(60);for(let i=0;i<110;i++){const b=r()*8+0.2,ph=r()*TAU,rad=lerp(100,600,r()),spd=lerp(.5,1.1,r()),tone=Math.floor(r()*5);const age=q12(lt7)-b;if(age<0)continue;const k=age*spd;
      const rr=rad*(1+k*.6);const ang=ph+k*1.2;const x=1180+Math.cos(ang)*rr*1.25,y=430+Math.sin(ang)*rr;const sz=5+k*12;if(sz>70)continue;leafSprite(ctx,x,y,sz,Math.floor((ang*2)*4)/4,tone,Math.min(1,k*1.5)*(1-sstep(5,8,k)),1.4);}
    ctx.restore();
    if(lt7>4)ctx.save(),ctx.translate(0,0),flock(ctx,t,45.6,[[-100,200],[-100,500]],12,54,{dur:2,size:14,dx:260}),ctx.restore();
  }
  drawLayers(S,cam,t,true,0);
  // sun rays (screen space)
  const sp=toScreen(cam,S.sun.x,S.sun.y,0.1);
  if(sh.set==='up'){ctx.save();ctx.globalCompositeOperation='screen';softBlob(ctx,sp[0],sp[1],640,540,[255,214,140],.5);softBlob(ctx,sp[0],sp[1],260,220,[255,244,214],.55);ctx.restore();}
  const rayK=sh.set==='up'?.6:(sh.id===1?0.08:sh.id===2?sunUp*.55:.5+.2*(sh.id>=6?1:0));
  sunRays(ctx,sp[0],sp[1],t,rayK,{a0:sh.set==='up'?0:1.95,spread:sh.set==='up'?TAU:1.15,n:sh.set==='up'?12:9,seed:sh.set==='up'?5:77,glowR:sh.set==='up'?700:520,col:sh.set==='up'?[255,232,170]:undefined});
  // flashes
  let flash=0;if(t>=37.2&&t<37.45)flash=1-(t-37.2)/.25;if(t>=41.25&&t<41.5)flash=Math.max(flash,.8*(1-(t-41.25)/.25));
  if(flash>0){ctx.fillStyle=css([255,246,225],flash);ctx.fillRect(0,0,W,H);}
  filmLook(ctx,t,{vig:.42,grain:.15});
  // fades & title
  let fade=0;if(t<1.6)fade=1-sstep(0,1.6,t);if(t>DUR-1.2)fade=sstep(DUR-1.2,DUR,t);
  if(fade>0){ctx.fillStyle=css([0,0,0],fade);ctx.fillRect(0,0,W,H);}
  const tt=sstep(48.6,50.2,t)*(1-sstep(52.2,53,t));
  if(tt>0){ctx.save();ctx.globalAlpha=tt;ctx.fillStyle=css([248,240,222]);ctx.textAlign='center';ctx.font='500 64px "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';ctx.fillText('森 の 目 覚 め',W/2,H*.5-10);ctx.font='300 22px Georgia,serif';ctx.globalAlpha=tt*.75;ctx.fillText('T H E   F O R E S T   W A K E S',W/2,H*.5+48);ctx.restore();}
}
// ── boot
async function init(){const msg=document.getElementById('msg'),bar=document.getElementById('bar');const step=async(name,f,pct)=>{msg.textContent=name;bar.style.width=pct+'%';await new Promise(r=>setTimeout(r,20));f();};
  await step('PAINTING THE FOREST…',()=>{SETS.wide=paintWideSet();},30);
  await step('PAINTING THE CANOPY…',()=>{SETS.up=paintUpSet();},65);
  await step('INKING THE GUARDIAN…',()=>{drawMound(ctx);drawMoundFront(ctx);renderFrame(0.2);renderFrame(8);},90);
  // adaptive resolution: time a heavy frame
  {const t0=performance.now();renderFrame(30);renderFrame(38);const ms=(performance.now()-t0)/2;window.__stats={frameMs:ms};if(ms>70){Q=2/3;canvas.width=Math.round(W*Q);canvas.height=Math.round(H*Q);}}
  bar.style.width='100%';window.__ready=true;
  if(location.search.includes('manual'))return;
  document.getElementById('ui').classList.add('hidden');setTimeout(()=>bar.style.display='none',600);
  const t0=performance.now();let last=-1,acc=0,n=0;
  const loop=()=>{const t=(performance.now()-t0)/1000;const f=Math.floor(t*24);if(f!==last){last=f;const a=performance.now();renderFrame(f/24);acc+=performance.now()-a;n++;
      if(n===36){const avg=acc/n;acc=0;n=0;if(avg>34&&Q>.5){Q=Q>.7?2/3:.5;canvas.width=Math.round(W*Q);canvas.height=Math.round(H*Q);}}}
    requestAnimationFrame(loop);};requestAnimationFrame(loop);}
window.__renderAt=async t=>{renderFrame(t);};
function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=(W*s)+'px';canvas.style.height=(H*s)+'px';}
window.addEventListener('resize',fit);fit();
init();

</script>

    d[i4] = lerp(196, 170, lich) * shade; d[i4 + 1] = lerp(186, 182, lich) * shade; d[i4 + 2] = lerp(168, 128, lich) * shade; d[i4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  TEX.rock = toTex(cv);
}

function texWicker() {
  const S = 128; const { cv, ctx } = canvas(S);
  pixelPass(ctx, S, S, (x, y, o) => { const a = Math.sin(x / S * TAU * 12) * 0.5 + 0.5, b = Math.sin(y / S * TAU * 10 + ((Math.floor(x / S * 12) & 1) ? Math.PI : 0)) * 0.5 + 0.5;
    const l = 0.6 + 0.4 * (a * 0.5 + b * 0.5); o[0] = 214 * l; o[1] = 170 * l; o[2] = 110 * l; });
  TEX.wicker = toTex(cv);
}

function texCheck() {
  const S = 128; const { cv, ctx } = canvas(S); ctx.fillStyle = rgb(246, 240, 228); ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = 'rgba(190,60,50,0.55)'; for (let i = 0; i < S; i += 32) { ctx.fillRect(i, 0, 14, S); ctx.fillRect(0, i, S, 14); }
  TEX.check = toTex(cv);
  const s2 = canvas(S); s2.ctx.fillStyle = rgb(246, 240, 228); s2.ctx.fillRect(0, 0, S, S); s2.ctx.fillStyle = rgb(80, 120, 170);
  for (let i = 0; i < S; i += 24) s2.ctx.fillRect(0, i, S, 8);
  TEX.stripe = toTex(s2.cv);
}

/* =====================  materials & shader patches  ===================== */
const U = {
  time: { value: 0 },
  sunDir: { value: V3(-0.55, 0.5, 0.62).normalize() },
  sunCol: { value: C(0xfff0d6) },
};
const SUN_DIR = U.sunDir.value;

/* aerial perspective: exponential (not squared) fog, thicker near the valley floor, bluer with distance */
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG\n varying float vFogDepth; varying float vFogY;\n#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG\n vFogDepth = - mvPosition.z; vFogY = cameraPosition.y + ( transpose( mat3( viewMatrix ) ) * mvPosition.xyz ).y;\n#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG\n uniform vec3 fogColor; varying float vFogDepth; varying float vFogY;\n #ifdef FOG_EXP2\n uniform float fogDensity;\n #else\n uniform float fogNear; uniform float fogFar;\n #endif\n#endif`;
THREE.ShaderChunk.fog_fragment = /* glsl */`
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float hgt = mix( 1.0, 0.42, smoothstep( 0.0, 520.0, vFogY ) );
    float fogFactor = 1.0 - exp( - fogDensity * vFogDepth * hgt );
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  vec3 fogC = mix( fogColor, fogColor * vec3( 0.8, 0.92, 1.1 ), smoothstep( 0.2, 0.9, fogFactor ) );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogC, fogFactor );
#endif
`;

const GLSL_WIND = /* glsl */`
vec3 windAt(vec3 wp, float t){
  float gust = 0.55 + 0.45 * sin(t*0.31 + wp.x*0.021) * sin(t*0.17 + wp.z*0.027 + 1.3);
  float s1 = sin(t*1.21 + wp.x*0.33 + wp.z*0.21);
  float s2 = sin(t*2.63 + wp.x*0.91 - wp.z*0.67) * 0.45;
  float s3 = sin(t*4.9 + dot(wp.xz, vec2(2.3, 1.9)) + wp.y*1.7) * 0.18;
  float s = (s1 + s2 + s3) * gust;
  return vec3(0.85, 0.08*s, 0.4) * s;
}
`;

/* patch a MeshStandardMaterial:
 *   vary  : low-frequency world-space colour variation (painterly unevenness)
 *   ao    : darken surfaces near ground level (contact occlusion)
 *   wind  : 'attr' (merged foliage, weight in aWind) | 'height' (instanced tufts, weight = local y)
 *   foliage: wrap lighting + sun transmission */
function patchMat(mat, { vary = 0.08, ao = 0, wind = null, windAmp = 1, foliage = null, uvWorld = 0, rock = null } = {}) {
  mat.userData.patch = { vary, ao, wind, foliage, rock: !!rock };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.time; if (rock) sh.uniforms.uRock = { value: rock };
    let vs = sh.vertexShader, fs = sh.fragmentShader;
    vs = 'varying vec3 vWPos;\nvarying vec3 vWNormal;\nuniform float uTime;\nattribute float aWind;\n' + GLSL_WIND + vs;
    vs = vs.replace('#include <beginnormal_vertex>', '#include <beginnormal_vertex>\n vWNormal = normalize(mat3(modelMatrix) * objectNormal);');
    let windCode = '';
    if (wind === 'attr') windCode = `transformed += windAt(vWPos, uTime) * aWind * ${windAmp.toFixed(3)};`;
    if (wind === 'height') windCode = `{ float wh = max(position.y, 0.0); transformed.xz += windAt(vWPos, uTime).xz * wh * wh * ${windAmp.toFixed(3)}; }`;
    vs = vs.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wvp = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wvp = instanceMatrix * wvp;
      #endif
      wvp = modelMatrix * wvp; vWPos = wvp.xyz;
      ${windCode}`);
    fs = 'varying vec3 vWPos;\nvarying vec3 vWNormal;\nuniform float uTime;\n' + (rock ? 'uniform sampler2D uRock;\n' : '') + GLSL_NOISE + fs;
    fs = fs.replace('#include <color_fragment>', `#include <color_fragment>
      {
        float macro = wv_fbm(vWPos.xz * 0.11 + vWPos.y * 0.07);
        float micro = wv_noise(vWPos.xz * 1.7 + vWPos.y * 1.3);
        diffuseColor.rgb *= 1.0 + (macro - 0.5) * ${(vary * 2).toFixed(3)} + (micro - 0.5) * ${(vary * 0.5).toFixed(3)};
        ${rock ? `{ vec3 wn = normalize(vWNormal); float steep = smoothstep(0.8, 0.58, wn.y);
          if (steep > 0.001) { vec3 bw = pow(abs(wn), vec3(4.0)); bw /= (bw.x + bw.y + bw.z);
            vec3 rk = texture2D(uRock, vWPos.zy * 0.11).rgb * bw.x + texture2D(uRock, vWPos.xy * 0.11).rgb * bw.z + texture2D(uRock, vWPos.xz * 0.11).rgb * bw.y;
            float lich = smoothstep(0.55, 0.75, wv_fbm(vWPos.xz * 0.05 + vWPos.y * 0.04));
            rk = mix(rk * vec3(0.98, 0.94, 0.88), rk * vec3(0.78, 0.86, 0.62), lich * 0.6);
            diffuseColor.rgb = mix(diffuseColor.rgb, rk, steep); }
          float far = smoothstep(260.0, 900.0, length(vWPos.xz - vec2(20.0, -150.0)));
          float woods = smoothstep(0.42, 0.62, wv_fbm(vWPos.xz * 0.009 + 4.0)) * smoothstep(0.55, 0.85, wn.y) * far;
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.12, 0.2, 0.09), woods * 0.75);
          diffuseColor.rgb *= mix(1.0, 0.72 + 0.5 * wv_fbm(vWPos.xz * 0.004), far);
          diffuseColor.rgb *= mix(0.72, 1.0, smoothstep(0.45, 0.92, wn.y)); }` : ''}
        ${ao ? `float gAO = mix(${(1 - ao).toFixed(3)}, 1.0, smoothstep(-0.1, 1.2, vWPos.y));
        diffuseColor.rgb *= gAO;` : ''}
      }`);
    if (foliage) {
      const [wrap, trans] = foliage;
      // foliage uses volumetric (radial) normals: never flip them on back faces
      fs = fs.replace('#include <normal_fragment_begin>', THREE.ShaderChunk.normal_fragment_begin.replace('normal *= faceDirection;', ''));
      fs = fs.replace('#include <lights_physical_pars_fragment>', THREE.ShaderChunk.lights_physical_pars_fragment.replace(
        'float dotNL = saturate( dot( geometryNormal, directLight.direction ) );',
        `float dotNLr = dot( geometryNormal, directLight.direction );
         float dotNL = saturate( dotNLr );
         float wrapNL = saturate( ( dotNLr + ${wrap.toFixed(3)} ) / ( 1.0 + ${wrap.toFixed(3)} ) );
         reflectedLight.directDiffuse += directLight.color * BRDF_Lambert( material.diffuseColor ) * ( max( wrapNL - dotNL, 0.0 )
           + ${trans.toFixed(3)} * ( pow( saturate( dot( -geometryViewDir, directLight.direction ) ), 4.0 ) * 2.4 + saturate( -dotNLr ) * 0.8 ) );`));
    }
    sh.vertexShader = vs; sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => JSON.stringify(mat.userData.patch);
  return mat;
}

function texRep(tex, m) { const t = tex.clone(); t.repeat.set(1 / m, 1 / m); t.needsUpdate = true; return t; }

/* =====================  world layout: terrain, river, streets, quay  ===================== */
const WATER_Y = -1.6;
const CASTLE = { x: -200, z: -560 };
const VIADUCT_Z = -240;
const FALL_Z = VIADUCT_Z + 44;
const RIPPLES = [];          // {x, z, r, s} local ripple sources for the water shader

/* river centreline / half width, sampled by z (Catmull-Rom through control points) */
const RIVER_PTS = [ // z, cx, halfWidth
  [-2600, 300, 40], [-1400, 160, 32], [-800, 95, 26], [-520, 66, 21], [-380, 56, 19], [-300, 52, 18], [-230, 49, 20],
  [-160, 46, 24], [-100, 44, 28], [-60, 43, 31], [-20, 42.6, 32.3], [20, 43.4, 32.8], [60, 45, 34], [120, 48, 36], [400, 60, 40], [2600, 120, 60],
];
function riverAt(z) {
  const P = RIVER_PTS; let i = 0;
  while (i < P.length - 2 && z > P[i + 1][0]) i++;
  const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
  const t = clamp((z - p1[0]) / (p2[0] - p1[0]), 0, 1);
  const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
  return { cx: cr(p0[1], p1[1], p2[1], p3[1]), w: cr(p0[2], p1[2], p2[2], p3[2]) };
}
const quayX = (z) => { const r = riverAt(z); return r.cx - r.w; };
const QUAY_Z0 = -78, QUAY_Z1 = 74;
const isQuay = (z) => z > QUAY_Z0 && z < QUAY_Z1;

function townMask(x, z) { return (1 - smooth(70, 120, z)) * smooth(-125, -78, z) * smooth(-130, -88, x); }
function townLevel(x, z) { return smooth(-34, -84, z) * 6.5 + smooth(-40, -92, x) * 5 + smooth(-40, -84, z) * smooth(-10, -40, x) * 3; }

function terrainH(x, z) {
  const { cx, w } = riverAt(z);
  const sd = Math.abs(x - cx) - w;
  const left = x < cx;
  const d = Math.max(0, sd);
  const n1 = fbm(x * 0.006 + 11, z * 0.006, 4), n2 = ridged(x * 0.004, z * 0.004 + 7, 5);
  const gorge = Math.exp(-(((z - VIADUCT_Z) / 75) ** 2));
  const up = smooth(-90, -520, z);
  const L = lerp(lerp(left ? 125 : 150, 175, up), 52, gorge);
  const Hm = lerp(lerp(left ? 46 : 38, 115, up), 74, gorge);
  let land = 0.45 + Hm * (1 - Math.exp(-d / L)) * (0.76 + 0.48 * n1);
  land += (n2 - 0.45) * 28 * smooth(30, 220, d);
  land += (fbm(x * 0.05, z * 0.05, 3) - 0.5) * 1.6 * smooth(4, 30, d);
  const r = Math.hypot(x - 40, z + 260);
  land += smooth(900, 2100, r) * (90 + 400 * ridged(x * 0.0011 + 3, z * 0.0011, 5));
  land += 78 * Math.exp(-(((x - CASTLE.x) ** 2 + (z - CASTLE.z) ** 2) / (2 * 52 * 52)));
  if (!left) land += 6 * Math.exp(-(((z - FALL_Z) / 16) ** 2)) * smooth(4.0, 16.0, sd) * (1 - smooth(25, 80, sd));
  const tm = townMask(x, z);
  if (tm > 0 && left) land = lerp(land, townLevel(x, z), tm);
  if (sd < 0) return WATER_Y - 0.7 - 2.8 * smooth(0, 16, -sd);
  const bw = lerp(10, 22, smooth(-60, -200, z));
  if (!(left && isQuay(z)) && sd < bw) land = lerp(WATER_Y - 0.55, land, smooth(0, bw, sd) ** 1.4);
  return land;
}

/* ---------------- terrain mesh: polar grid, dense near town, sparse far away ---------------- */
function buildTerrain() {
  const CXo = 6, CZo = -14, rings = LOW ? 250 : 360, segs = LOW ? 320 : 460, r0 = 1.2, rMax = 5200;
  const k = Math.pow(rMax / r0, 1 / rings);
  const nV = (rings + 1) * segs + 1;
  const pos = new Float32Array(nV * 3), col = new Float32Array(nV * 3), uv = new Float32Array(nV * 2);
  const idx = [];
  const pal = {
    meadow: C('#93ad4c'), lush: C('#6c9437'), dry: C('#b7b16a'), dirt: C('#a08a64'), rock: C('#8e877b'), rockW: C('#a49377'),
    forest: C('#4f6c34'), wet: C('#6d6b4b'), bed: C('#59604a'), town: C('#a49d78'),
  };
  const tmp = new THREE.Color();
  const put = (i, x, z) => {
    const y = terrainH(x, z);
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z; uv[i * 2] = x / 6; uv[i * 2 + 1] = z / 6;
  };
  const paint = (i, x, y, z, ny) => {
    const slope = Math.sqrt(Math.max(0, 1 / (ny * ny) - 1));
    const n = fbm(x * 0.03, z * 0.03, 3), m = fbm(x * 0.008 + 5, z * 0.008, 3);
    tmp.copy(pal.meadow).lerp(pal.lush, smooth(0.35, 0.65, n)).lerp(pal.dry, smooth(0.6, 0.8, m) * 0.6);
    const tm = townMask(x, z) * (x < riverAt(z).cx ? 1 : 0);
    tmp.lerp(pal.town, tm * smooth(0.45, 0.62, fbm(x * 0.12, z * 0.12, 3)) * 0.55);
    if (y > 12) tmp.lerp(pal.forest, smooth(12, 40, y) * 0.7);
    tmp.lerp(pal.dirt, smooth(0.55, 0.9, slope) * 0.6);
    tmp.lerp(fbm(x * 0.02, z * 0.02, 2) > 0.5 ? pal.rock : pal.rockW, smooth(0.8, 1.4, slope));
    if (y < WATER_Y + 0.6) tmp.lerp(pal.wet, smooth(WATER_Y + 0.6, WATER_Y - 0.1, y));
    if (y < WATER_Y - 0.3) tmp.copy(pal.bed);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  };
  put(0, CXo, CZo);
  for (let r = 0; r <= rings; r++) {
    const rad = r0 * Math.pow(k, r);
    for (let s = 0; s < segs; s++) { const a = s / segs * TAU; put(1 + r * segs + s, CXo + Math.cos(a) * rad, CZo + Math.sin(a) * rad); }
  }
  for (let s = 0; s < segs; s++) idx.push(0, 1 + (s + 1) % segs, 1 + s);
  for (let r = 0; r < rings; r++) for (let s = 0; s < segs; s++) {
    const a = 1 + r * segs + s, b = 1 + r * segs + (s + 1) % segs, c = a + segs, d = b + segs;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const nrm = g.attributes.normal;
  for (let i = 0; i < nV; i++) paint(i, pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2], Math.max(0.05, nrm.getY(i)));
  const mesh = new THREE.Mesh(g, MAT.ground); mesh.receiveShadow = true; mesh.name = 'terrain';
  return mesh;
}

/* ---------------- streets (cobble ribbons that follow their curve) ---------------- */
const STREETS = [];
function ribbon(B, pts, width, key, { crown = 0.05, lift = 0.04, segLen = 0.8, edgeJit = 0.25, flat = null } = {}) {
  const curve = new THREE.CatmullRomCurve3(pts.map((p) => V3(p[0], 0, p[1])), false, 'centripetal');
  const n = Math.max(4, Math.ceil(curve.getLength() / segLen));
  const across = 6; const P = new THREE.Vector3(), Tn = new THREE.Vector3();
  const pos = [], uv = [], idx = [];
  let len = 0, prev = curve.getPointAt(0);
  for (let i = 0; i <= n; i++) {
    const t = i / n; curve.getPointAt(t, P); curve.getTangentAt(t, Tn); len += P.distanceTo(prev); prev.copy(P);
    const nx = -Tn.z, nz = Tn.x; const wj = width / 2 + (fbm(len * 0.15, 3.3, 2) - 0.5) * edgeJit * 2;
    for (let j = 0; j <= across; j++) {
      const s = j / across * 2 - 1; const x = P.x + nx * s * wj, z = P.z + nz * s * wj;
      const y = (flat !== null ? flat : terrainH(x, z)) + lift + crown * (1 - s * s);
      pos.push(x, y, z); uv.push(s * wj, len);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < across; j++) { const a = i * (across + 1) + j, b = a + across + 1; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  B.add(key, g, 0xffffff);
  STREETS.push({ curve, width });
  return curve;
}
/* distance from a point to the nearest street edge (negative = on the street) */
function streetDist(x, z) {
  let best = 1e9;
  for (const s of STREETS) {
    if (!s.samples) { s.samples = s.curve.getSpacedPoints(Math.ceil(s.curve.getLength() / 0.7)); }
    for (const p of s.samples) { const d = Math.hypot(p.x - x, p.z - z) - s.width / 2; if (d < best) best = d; }
  }
  return best;
}

/* ---------------- instanced balusters ---------------- */
const BALUSTERS = [];
function balusterGeo() {
  const pr = [[0.0, 0], [0.075, 0], [0.075, 0.05], [0.05, 0.07], [0.058, 0.16], [0.085, 0.3], [0.07, 0.4], [0.042, 0.47], [0.04, 0.52], [0.062, 0.55], [0.062, 0.6], [0.0, 0.6]];
  return new THREE.LatheGeometry(pr.map(([r, y]) => new THREE.Vector2(r, y)), 10);
}
/* balustrade along a polyline at height y0 (top of plinth at y0+0.12) */
function balustrade(B, pts, y0 = 0, { gapEvery = 3.2 } = {}) {
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
    const L = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(x1 - x0, z1 - z0);
    const segs = Math.max(1, Math.round(L / gapEvery));
    for (let s = 0; s < segs; s++) {
      const t0 = s / segs, t1 = (s + 1) / segs; const sl = L / segs;
      const ax = lerp(x0, x1, t0), az = lerp(z0, z1, t0), bx = lerp(x0, x1, t1), bz = lerp(z0, z1, t1);
      const mx = (ax + bx) / 2, mz = (az + bz) / 2; const tone = jitter('#e9dcc2', 0.01, 0.04, 0.05);
      B.add('trim', boxM(0.34, 0.14, sl), tone, T(mx, y0 + 0.07, mz, ang));
      B.add('trim', boxM(0.3, 0.12, sl), tone, T(mx, y0 + 0.86, mz, ang));
      B.add('trim', boxM(0.36, 0.05, sl + 0.02), tone, T(mx, y0 + 0.94, mz, ang));
      const nb = Math.floor((sl - 0.5) / 0.26);
      for (let b = 0; b < nb; b++) { const t = (b + 1) / (nb + 1); BALUSTERS.push([lerp(ax, bx, t), y0 + 0.14, lerp(az, bz, t), ang]); }
    }
    for (let s = 0; s <= segs; s++) { const t = s / segs; const px = lerp(x0, x1, t), pz = lerp(z0, z1, t); const tone = jitter('#e6d8bd', 0.01, 0.04, 0.05);
      if (s === 0 && i > 0) continue;
      B.add('trim', boxM(0.42, 1.0, 0.42), tone, T(px, y0 + 0.5, pz, ang));
      B.add('trim', boxM(0.5, 0.07, 0.5), tone, T(px, y0 + 1.03, pz, ang));
    }
  }
}
function buildBalusters() {
  const geo = balusterGeo(); geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count * 3).fill(1), 3));
  const m = new THREE.InstancedMesh(geo, MAT.trim, BALUSTERS.length);
  const col = new THREE.Color();
  BALUSTERS.forEach(([x, y, z, a], i) => { m.setMatrixAt(i, T(x, y, z, a)); m.setColorAt(i, col.copy(jitter('#ebdfc6', 0.01, 0.03, 0.04))); });
  m.castShadow = m.receiveShadow = true; m.name = 'balusters';
  return m;
}

/* ---------------- quay wall + terrace + dock ---------------- */
const TERRACE = { x0: 3.4, x1: 17.2, z0: 3.0, z1: 27.0, seatZ0: 14.0, seatZ1: 17.0 };
const DOCK = { z0: -6.2, z1: -3.6, len: 15 };

function wallStrip(B, pts, yBot, yTop, key = 'stone', outward = 1) {
  // vertical stone wall along polyline pts [[x,z],...], face normal to the right of travel * outward
  const pos = [], uv = [], col = [], idx = [];
  const levels = [yBot, WATER_Y - 0.25, WATER_Y + 0.35, WATER_Y + 0.9, yTop];
  const lc = [C('#4c5a3e'), C('#5f6450'), C('#8c8672'), C('#c9c0ad'), C('#ffffff')];
  let len = 0;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    for (let l = 0; l < levels.length; l++) {
      pos.push(pts[i][0], levels[l], pts[i][1]); uv.push(len, levels[l]); col.push(lc[l].r, lc[l].g, lc[l].b);
    }
  }
  const nl = levels.length;
  for (let i = 0; i < pts.length - 1; i++) for (let l = 0; l < nl - 1; l++) {
    const a = i * nl + l, b = a + 1, c = a + nl, d = c + 1;
    if (outward > 0) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
  B.add(key, g);
}

function buildQuay(B) {
  // quay line, with the terrace protrusion carved out
  const north = [], south = [];
  for (let z = QUAY_Z1; z >= TERRACE.z1; z -= 1.5) north.push([quayX(z), z]);
  north.push([quayX(TERRACE.z1), TERRACE.z1]);
  for (let z = TERRACE.z0; z >= QUAY_Z0; z -= 1.5) south.push([quayX(z), z]);
  wallStrip(B, north, WATER_Y - 3, 0.02, 'stone', 1);
  wallStrip(B, south, WATER_Y - 3, 0.02, 'stone', 1);
  // terrace walls (face outward to the river)
  const t = TERRACE;
  wallStrip(B, [[quayX(t.z1), t.z1], [t.x1, t.z1]], WATER_Y - 3, 0.02, 'stone', 1);
  wallStrip(B, [[t.x1, t.z1], [t.x1, t.z0]], WATER_Y - 3, 0.02, 'stone', 1);
  wallStrip(B, [[t.x1, t.z0], [quayX(t.z0), t.z0]], WATER_Y - 3, 0.02, 'stone', 1);
  // coping stones on quay top
  const cope = (pts) => { for (let i = 0; i < pts.length - 1; i++) { const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
    const L = Math.hypot(x1 - x0, z1 - z0); const a = Math.atan2(x1 - x0, z1 - z0); const nx = (z1 - z0) / L, nz = -(x1 - x0) / L;
    B.add('trim', boxM(0.7, 0.2, L + 0.02), jitter('#d9ccb0', 0.01, 0.03, 0.05), T((x0 + x1) / 2 - nx * 0.25, -0.06, (z0 + z1) / 2 - nz * 0.25, a)); } };
  cope(north); cope(south);
  // terrace floor (flagstones), covers the street-side strip and the protrusion
  const fl = new THREE.PlaneGeometry(t.x1 - t.x0, t.z1 - t.z0); fl.rotateX(-Math.PI / 2);
  const uvA = fl.attributes.uv; const pA = fl.attributes.position;
  for (let i = 0; i < uvA.count; i++) uvA.setXY(i, pA.getX(i) + (t.x0 + t.x1) / 2, -(pA.getZ(i) + (t.z0 + t.z1) / 2));
  B.add('flag', fl, 0xffffff, T((t.x0 + t.x1) / 2, 0.045, (t.z0 + t.z1) / 2));
  // terrace edge coping
  B.add('trim', boxM(0.5, 0.16, t.z1 - t.z0 + 0.4), C('#ddd0b4'), T(t.x1 - 0.2, -0.03, (t.z0 + t.z1) / 2));
  B.add('trim', boxM(t.x1 - quayX(t.z1) + 0.2, 0.16, 0.5), C('#ddd0b4'), T((t.x1 + quayX(t.z1)) / 2, -0.03, t.z1 - 0.2));
  B.add('trim', boxM(t.x1 - quayX(t.z0) + 0.2, 0.16, 0.5), C('#ddd0b4'), T((t.x1 + quayX(t.z0)) / 2, -0.03, t.z0 + 0.2));
  // balustrades — terrace front has a low solid parapet where the girl sits
  const ex = t.x1 - 0.25;
  balustrade(B, [[quayX(t.z1) + 0.3, t.z1 - 0.25], [ex, t.z1 - 0.25], [ex, t.seatZ1]], 0.05);
  balustrade(B, [[ex, t.seatZ0], [ex, t.z0 + 0.25], [quayX(t.z0) + 0.3, t.z0 + 0.25]], 0.05);
  // low parapet (seat)
  const pz = (t.seatZ0 + t.seatZ1) / 2, pl = t.seatZ1 - t.seatZ0;
  B.add('stone', boxM(0.44, 0.42, pl), C('#e3d6bd'), T(ex, 0.26, pz));
  B.add('trim', boxM(0.56, 0.08, pl + 0.06), C('#eadfc8'), T(ex, 0.5, pz));
  // promenade balustrade north of the terrace (toward the viewer)
  const prom = []; for (let z = t.z1 + 0.6; z <= 66; z += 3.2) prom.push([quayX(z) - 0.3, z]);
  balustrade(B, prom, 0.02);
  // short balustrade between terrace and the dock stairs
  balustrade(B, [[quayX(t.z0 - 0.6) - 0.3, t.z0 - 0.6], [quayX(1.6) - 0.3, 1.6]], 0.02);
  buildDock(B);
}

function buildDock(B) {
  const d = DOCK, xq = quayX((d.z0 + d.z1) / 2), deckY = WATER_Y + 0.5;
  // stone stairs descending along the quay face from z=1.2 (top) to the dock
  const steps = 7, rise = (0.02 - deckY) / steps, run = 0.36;
  for (let s = 0; s < steps; s++) {
    const y = 0.02 - (s + 1) * rise; const z = 1.0 - s * run;
    B.add('trim', boxM(1.5, 0.16, run + 0.04), jitter('#d6c9ad', 0.01, 0.03, 0.06), T(xq + 0.75, y - 0.08 + rise * 0.0, z - run / 2));
    B.add('stone', boxM(1.5, y - (WATER_Y - 1.5), run), C('#cfc5b0'), T(xq + 0.75, (y + WATER_Y - 1.5) / 2 - 0.08, z - run / 2));
  }
  B.add('stone', boxM(0.3, 0.9, steps * run), C('#d8cdb6'), T(xq + 1.55, deckY + 0.6, 1.0 - steps * run / 2));
  // deck boards
  const z0 = d.z0, z1 = d.z1, x0 = xq, x1 = xq + d.len;
  for (let x = x0; x < x1; x += 0.2) {
    B.add('wood', boxM(0.18, 0.06, z1 - z0 + R(-0.04, 0.12)), jitter('#9b7f5e', 0.02, 0.08, 0.1), T(x + 0.1, deckY + R(-0.01, 0.01), (z0 + z1) / 2 + R(-0.05, 0.05), R(-0.01, 0.01)));
  }
  // joists and posts
  for (const z of [z0 + 0.12, z1 - 0.12]) {
    B.add('wood', boxM(x1 - x0, 0.16, 0.14), C('#6f5a43'), T((x0 + x1) / 2, deckY - 0.11, z));
    for (let x = x0 + 1.6; x <= x1 + 0.01; x += 2.4) {
      const top = deckY + (x > x1 - 1 ? 0.7 : R(0.08, 0.5));
      B.add('wood', cylM(0.11, 0.13, top - (WATER_Y - 2.5), 8), jitter('#5e4b38', 0.02, 0.05, 0.08), T(x, (top + WATER_Y - 2.5) / 2, z + (z < (z0 + z1) / 2 ? -0.12 : 0.12)));
      RIPPLES.push({ x, z: z + (z < (z0 + z1) / 2 ? -0.12 : 0.12), r: 0.14, s: 0.6 });
    }
  }
  // iron mooring rings / bollards
  for (const x of [x0 + 5, x0 + 10]) B.add('metal', cylM(0.09, 0.11, 0.35, 10), 0xffffff, T(x, deckY + 0.2, z1 - 0.25));
}

/* =====================  architecture kit  ===================== *
 * Local convention for a facade: outer face at z = 0, the wall body at z < 0,
 * x across the facade, y up from the ground line.                          */

const ANCHORS = { flowerBoxes: [], pots: [], ivy: [], smoke: [], beds: [], lamps: [] };
const PAL = {
  cream: '#f3e7cd', white: '#f6f0e3', peach: '#f0d2b6', pink: '#eecac0', butter: '#f2dea6', ochre: '#e6bd80', sage: '#d3dbbd', blue: '#cfdbe0',
  terracotta: '#c8683f', red: '#b44e35', orange: '#d68048', brown: '#9c5d3e', slate: '#7c8a99', slateDark: '#64707e', copper: '#76a394',
  stoneWarm: '#e4d6bb', stoneGray: '#d2cbbd', timber: '#5c4130', frame: '#f4f0e6',
  shGreen: '#5f8d6c', shBlue: '#5c82a0', shTeal: '#4f8c8c', shRed: '#9e4c3d', shOlive: '#7d8a4e', doorGreen: '#3f6b54', doorBlue: '#3f6184', doorRed: '#8a3d2f',
};
const worldOf = (B, m) => B.top.clone().multiply(m);

function wallGeo(w, h, t, holes = [], gable = 0, x0 = -w / 2) {
  const s = new THREE.Shape();
  s.moveTo(x0, 0); s.lineTo(x0 + w, 0); s.lineTo(x0 + w, h);
  if (gable > 0) s.lineTo(x0 + w / 2, h + gable);
  s.lineTo(x0, h); s.closePath();
  for (const o of holes) {
    const p = new THREE.Path(); const xa = o.x - o.w / 2, xb = o.x + o.w / 2, ya = o.y, yb = o.y + o.h;
    if (o.arch) { const r = o.w / 2, yc = yb - r; p.moveTo(xa, ya); p.lineTo(xb, ya); p.lineTo(xb, yc); p.absarc(o.x, yc, r, 0, Math.PI, false); p.lineTo(xa, ya); }
    else { p.moveTo(xa, ya); p.lineTo(xb, ya); p.lineTo(xb, yb); p.lineTo(xa, yb); p.lineTo(xa, ya); }
    s.holes.push(p);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 12 });
  g.translate(0, 0, -t); return g;
}
/* half annulus (arch ring) in the XY plane, extruded toward -z */
function archRingGeo(r0, r1, depth, seg = 14) {
  const s = new THREE.Shape(); s.moveTo(r1, 0); s.absarc(0, 0, r1, 0, Math.PI, false); s.lineTo(-r0, 0); s.absarc(0, 0, r0, Math.PI, 0, true); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: seg }); g.translate(0, 0, -depth); return g;
}

/* ---------- windows ---------- */
function addShutterLeaf(B, lw, lh, col, m) {
  B.push(m); const c2 = C(col).multiplyScalar(0.86);
  B.add('wood', boxM(lw, lh, 0.03), col, T(lw / 2, lh / 2, -0.015));
  B.add('wood', boxM(0.06, lh, 0.05), col, T(0.03, lh / 2, 0.0));
  B.add('wood', boxM(0.06, lh, 0.05), col, T(lw - 0.03, lh / 2, 0.0));
  B.add('wood', boxM(lw, 0.07, 0.05), col, T(lw / 2, 0.035, 0)); B.add('wood', boxM(lw, 0.07, 0.05), col, T(lw / 2, lh - 0.035, 0));
  B.add('wood', boxM(lw, 0.06, 0.05), col, T(lw / 2, lh * 0.5, 0));
  const n = Math.floor((lh - 0.2) / 0.075);
  for (let i = 0; i < n; i++) { const y = 0.1 + i * 0.075; if (Math.abs(y - lh * 0.5) < 0.06) continue; B.add('wood', boxM(lw - 0.1, 0.055, 0.01), c2, T(lw / 2, y, 0.012, 0, -0.55)); }
  B.pop();
}
/* o: {x, y, w, h, arch}; st: {frame, shutter, box, sill, lintel, panes:[c,r], tint, inset, open} */
function addWindow(B, o, st = {}) {
  const { x, y, w, h } = o; const inset = st.inset ?? 0.16, fc = st.frame ?? PAL.frame, ft = 0.065, fd = 0.07;
  const top = o.arch ? y + h - w / 2 : y + h;
  B.add('wood', boxM(w, ft, fd), fc, T(x, y + ft / 2, -inset));
  B.add('wood', boxM(ft, top - y, fd), fc, T(x - w / 2 + ft / 2, (y + top) / 2, -inset));
  B.add('wood', boxM(ft, top - y, fd), fc, T(x + w / 2 - ft / 2, (y + top) / 2, -inset));
  if (o.arch) B.add('wood', archRingGeo(w / 2 - ft, w / 2, fd, 10), fc, T(x, top, -inset + fd / 2));
  else B.add('wood', boxM(w, ft, fd), fc, T(x, y + h - ft / 2, -inset));
  const [pc, pr] = st.panes ?? [2, 3];
  for (let i = 1; i < pc; i++) B.add('wood', boxM(0.04, (o.arch ? top : y + h) - y, 0.04), fc, T(x - w / 2 + w * i / pc, (y + (o.arch ? top : y + h)) / 2, -inset - 0.005));
  const ph = (o.arch ? top - y : h);
  for (let j = 1; j < pr; j++) B.add('wood', boxM(w, 0.035, 0.035), fc, T(x, y + ph * j / pr, -inset - 0.005));
  const gl = new THREE.PlaneGeometry(w - 0.02, h - 0.02);
  B.add('glass', gl, st.tint ?? '#ffffff', T(x, y + h / 2, -inset - 0.03));
  if (st.sill !== false) B.add('trim', boxM(w + 0.2, 0.075, 0.28), st.sillCol ?? PAL.stoneWarm, T(x, y - 0.035, 0.05));
  if (st.lintel === 'stone') B.add('trim', boxM(w + 0.32, 0.2, 0.07), st.sillCol ?? PAL.stoneWarm, T(x, y + h + 0.1, 0.02));
  if (st.lintel === 'arch' && o.arch) { B.add('trim', archRingGeo(w / 2, w / 2 + 0.16, 0.07, 12), st.sillCol ?? PAL.stoneWarm, T(x, top, 0.05)); B.add('trim', boxM(0.16, 0.24, 0.1), st.sillCol ?? PAL.stoneWarm, T(x, top + w / 2 + 0.05, 0.04)); }
  if (st.shutter) {
    const lw = w / 2 + 0.02, lh = (o.arch ? top - y : h) + 0.02; const ang = st.open ?? R(2.55, 2.85);
    addShutterLeaf(B, lw, lh, st.shutter, T(x - w / 2 - 0.02, y - 0.01, 0.035, -ang));
    addShutterLeaf(B, lw, lh, st.shutter, T(x + w / 2 + 0.02, y - 0.01, 0.035, Math.PI + (st.open2 ?? R(2.5, 2.85))));
  }
  if (st.box) {
    const bw = w + 0.12; const m = T(x, y - 0.17, 0.2);
    B.add('wood', boxM(bw, 0.22, 0.24), st.boxCol ?? '#8a5a3c', m);
    for (const s of [-1, 1]) B.add('metal', boxM(0.03, 0.2, 0.26), 0xffffff, T(x + s * (bw / 2 - 0.15), y - 0.25, 0.14));
    ANCHORS.flowerBoxes.push({ m: worldOf(B, T(x, y - 0.06, 0.2)), w: bw - 0.06, d: 0.2, kind: st.box });
  }
}

/* ---------- doors ---------- */
function addDoor(B, o, st = {}) {
  const { x, y, w, h } = o; const inset = st.inset ?? 0.22, col = st.col ?? PAL.doorGreen;
  const top = o.arch ? y + h - w / 2 : y + h;
  const leafH = (st.fan ? top - 0.42 : (o.arch ? y + h : top)) - y;
  // leaf with raised panels
  B.add('wood', boxM(w - 0.02, leafH, 0.06), col, T(x, y + leafH / 2, -inset));
  const pw = (w - 0.3) / 2;
  for (const s of [-1, 1]) for (const [py, ph] of [[0.25, leafH * 0.38], [0.35 + leafH * 0.38, leafH * 0.42]]) {
    if (py + ph > leafH - 0.12) continue;
    B.add('wood', boxM(pw, ph, 0.03), C(col).multiplyScalar(0.9), T(x + s * (pw / 2 + 0.05), y + py + ph / 2, -inset + 0.04));
  }
  if (o.arch && !st.fan) B.add('wood', new THREE.CircleGeometry(w / 2 - 0.01, 16, 0, Math.PI), col, T(x, top, -inset + 0.03));
  if (st.fan) {
    B.add('wood', boxM(w, 0.08, 0.1), PAL.frame, T(x, y + leafH + 0.04, -inset));
    const gl = o.arch ? new THREE.CircleGeometry(w / 2, 16, 0, Math.PI) : new THREE.PlaneGeometry(w, top - (y + leafH + 0.08));
    if (o.arch) { B.add('glass', gl, '#ffffff', T(x, top, -inset - 0.02)); B.add('glass', new THREE.PlaneGeometry(w, top - y - leafH - 0.08), '#fff', T(x, (top + y + leafH + 0.08) / 2, -inset - 0.02)); }
    else B.add('glass', gl, '#ffffff', T(x, (top + y + leafH + 0.08) / 2, -inset - 0.02));
    for (let i = 1; i < 4; i++) { const a = i / 4 * Math.PI; if (o.arch) B.add('wood', boxM(0.03, w / 2, 0.03), PAL.frame, T(x + Math.cos(a) * w / 4, top + Math.sin(a) * w / 4, -inset - 0.01, 0, 0, a - Math.PI / 2)); }
  }
  B.add('metal', new THREE.SphereGeometry(0.035, 8, 6), 0xffffff, T(x + w / 2 - 0.16, y + 1.0, -inset + 0.06));
  B.add('metal', boxM(0.04, 0.16, 0.02), 0xffffff, T(x + w / 2 - 0.16, y + 1.0, -inset + 0.035));
  // threshold step
  B.add('trim', boxM(w + 0.5, 0.16, 0.55), st.stepCol ?? PAL.stoneGray, T(x, y + 0.03, 0.18));
}

/* ---------- curved tiled roof with real thickness ---------- */
/* ridge along local x; slopes fall toward +z and -z.
 * o: {L (ridge length incl gable overhang), half (eave half-span incl overhang), eaveY, ridgeY, key, col, sag, rsag, t, barge} */
const COURSE = ROOF_TEX_M / ROOF_ROWS;
function roofSlab(B, o, side) {
  const L = o.L, half = o.half, t = o.t ?? 0.16, sag = o.sag ?? 0.12, rsag = o.rsag ?? 0.06, step = o.step ?? 0.03;
  const yAt = (u, v) => lerp(o.eaveY, o.ridgeY, v) - sag * Math.sin(Math.PI * v) * (1 - 0.3 * v) - rsag * Math.sin(Math.PI * u) * (0.35 + 0.65 * v) + (o.wob ?? 0.02) * Math.sin(u * 17.0 + v * 3) * Math.sin(Math.PI * u);
  const slopeLen = Math.hypot(half, o.ridgeY - o.eaveY);
  const K = Math.max(2, Math.round(slopeLen / COURSE));
  const vs = []; for (let k = 0; k < K; k++) { vs.push([k / K, 1]); vs.push([(k + 0.5) / K, 0.5]); vs.push([(k + 1) / K - 0.0035, 0.0]); } vs.push([1, 0]);
  const nu = Math.max(4, Math.ceil(L / 0.45));
  const pos = [], uv = [], idx = []; const P = new THREE.Vector3();
  for (let j = 0; j < vs.length; j++) for (let i = 0; i <= nu; i++) {
    const u = i / nu, [v, f] = vs[j];
    const y = yAt(u, v), z = side * half * (1 - v), x = -L / 2 + u * L;
    pos.push(x, y + step * f, z + side * step * f * 0.4); uv.push(x, v * slopeLen + 0.04);
  }
  for (let j = 0; j < vs.length - 1; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    if (side > 0) idx.push(a, b, d, a, d, c); else idx.push(a, d, b, a, c, d);
  }
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  g = g.toNonIndexed(); g.computeVertexNormals();
  B.add(o.key, g, o.col);
  // underside (soffit) and edges
  const und = surfaceGeo(nu, 6, (u, v, p) => p.set(-L / 2 + u * L, yAt(u, v) - t, side * half * (1 - v)), (u, v) => [u * L, v * slopeLen]);
  if (side > 0) { const ix = und.index.array; for (let i = 0; i < ix.length; i += 3) { const tmp = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = tmp; } und.computeVertexNormals(); }
  else { und.computeVertexNormals(); }
  B.add('wood', und, o.soffit ?? '#6b5240');
  // gable barge boards (both ends) and eave fascia
  const bc = o.barge ?? '#5e4736';
  for (const u of [0, 1]) {
    const strip = surfaceGeo(1, 8, (a, v, p) => p.set(-L / 2 + u * L + (u ? 0.025 : -0.025), yAt(u, v) - t - 0.05 + a * (t + 0.14), side * half * (1 - v)), (a, v) => [a * 0.3, v * slopeLen]);
    strip.computeVertexNormals(); B.add('wood', strip, bc);
    const flip = strip.clone(); const ix = flip.index.array; for (let i = 0; i < ix.length; i += 3) { const tmp = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = tmp; }
    flip.computeVertexNormals(); B.add('wood', flip, bc);
  }
  B.add('wood', boxM(L, t + 0.06, 0.05), bc, T(0, yAt(0.5, 0) - t / 2 + 0.01, side * (half + 0.02)));
  // rafter tails under the eave
  const ang = Math.atan2(o.ridgeY - o.eaveY, half);
  for (let x = -L / 2 + 0.4; x < L / 2 - 0.3; x += 0.6) B.add('wood', boxM(0.08, 0.11, (o.ohE ?? 0.5) + 0.3), '#5a4334', T(x, yAt(0.5, 0.06) - t - 0.06, side * (half - ((o.ohE ?? 0.5) + 0.3) / 2), 0, side * ang));
  return { yAt, slopeLen };
}
function gableRoof(B, o) {
  const a = roofSlab(B, o, 1); roofSlab(B, o, -1);
  // ridge cap: short half-round tiles following the ridge sag
  const n = Math.round(o.L / 0.42);
  for (let i = 0; i < n; i++) { const u = (i + 0.5) / n; const y = a.yAt(u, 1) + 0.02;
    B.add(o.key, cylM(0.13, 0.13, 0.44, 8, false), C(o.col).multiplyScalar(0.92), T(-o.L / 2 + u * o.L, y, 0, 0, 0, Math.PI / 2)); }
  const H = (x, z) => { const u = clamp((x + o.L / 2) / o.L, 0, 1), v = clamp(1 - Math.abs(z) / o.half, 0, 1); return a.yAt(u, v); };
  return H;
}

/* conical tower roof with a flared (concave) profile */
function coneRoof(B, o) {
  // o: {R (eave radius), y0 (eave y), H (height), key, col, flare}
  const prof = (v) => ({ r: o.R * Math.pow(1 - v, o.flare ?? 1.45), y: o.y0 + o.H * v });
  const slant = Math.hypot(o.R, o.H);
  const K = Math.max(3, Math.round(slant / COURSE));
  const vs = []; for (let k = 0; k < K; k++) { vs.push([k / K, 1]); vs.push([(k + 0.5) / K, 0.5]); vs.push([(k + 1) / K - 0.003, 0]); }
  const nu = 40; const pos = [], uv = [], idx = [];
  for (let j = 0; j < vs.length; j++) for (let i = 0; i <= nu; i++) {
    const [v, f] = vs[j]; const a = i / nu * TAU; const p = prof(v); const r = p.r + 0.035 * f;
    pos.push(Math.cos(a) * r, p.y + 0.01 * f, Math.sin(a) * r); uv.push(i / nu * TAU * o.R * 0.85, v * slant);
  }
  for (let j = 0; j < vs.length - 1; j++) for (let i = 0; i < nu; i++) { const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1; idx.push(a, d, b, a, c, d); }
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  g = g.toNonIndexed(); g.computeVertexNormals(); B.add(o.key, g, o.col);
  // soffit ring + fascia
  const und = new THREE.RingGeometry(o.R * 0.7, o.R, 40, 1); und.rotateX(Math.PI / 2); B.add('wood', und, '#6b5240', T(0, o.y0 - 0.02, 0));
  B.add('wood', cylM(o.R + 0.02, o.R + 0.02, 0.16, 40, true), '#5e4736', T(0, o.y0 - 0.06, 0));
  // finial
  B.add('metal', cylM(0.03, 0.06, 1.3, 8), 0xffffff, T(0, o.y0 + o.H + 0.5, 0));
  B.add('metal', new THREE.SphereGeometry(0.11, 10, 8), 0xffffff, T(0, o.y0 + o.H + 0.35, 0));
}

function chimney(B, x, z, yBase, yTop, o = {}) {
  const w = o.w ?? 0.7, d = o.d ?? 0.6;
  B.add(o.key ?? 'stone', boxM(w, yTop - yBase, d), o.col ?? '#d8c7ab', T(x, (yTop + yBase) / 2, z));
  B.add('trim', boxM(w + 0.16, 0.12, d + 0.16), '#d9d0c0', T(x, yTop + 0.06, z));

  if (o.pot2 !== false) B.add('plain', cylM(0.1, 0.12, 0.3, 10), '#a85f40', T(x + w * 0.2, yTop + 0.27, z));
  if (o.smoke) ANCHORS.smoke.push({ p: V3(x - w * 0.18, yTop + 0.55, z).applyMatrix4(B.top), rate: o.smoke });
}

/* corner quoins (alternating long/short dressed stones) */
function quoins(B, x, z, y0, y1, dirA, dirB, col = PAL.stoneWarm) {
  // dirA, dirB: unit vectors (in xz) along the two faces meeting at the corner (pointing away from the corner)
  let y = y0, k = 0;
  while (y < y1 - 0.2) {
    const h = 0.3, la = k % 2 ? 0.28 : 0.5, lb = k % 2 ? 0.5 : 0.28;
    const c = jitter(col, 0.01, 0.03, 0.04);
    B.add('trim', boxM(la, h - 0.03, 0.05), c, T(x + dirA[0] * la / 2, y + h / 2, z + dirA[1] * la / 2, Math.atan2(dirA[0], dirA[1]) - Math.PI / 2));
    B.add('trim', boxM(lb, h - 0.03, 0.05), c, T(x + dirB[0] * lb / 2, y + h / 2, z + dirB[1] * lb / 2, Math.atan2(dirB[0], dirB[1]) - Math.PI / 2));
    y += h; k++;
  }
}

/* ---------- generic house ----------
 * o: { w, d, base:{h,key,col}|null, H (eave height), wallKey, wallCol, ridge:'x'|'z', rise, roof:{key,col,ohE,ohG,sag,rsag},
 *      faces:{front:[...], back:[...], left:[...], right:[...]}, quoins, string, t }
 * openings: {type:'win'|'door', x, y, w, h, arch, st}

function house(B, o) {
  const w = o.w, d = o.d, t = o.t ?? 0.38, H = o.H, rise = o.rise ?? (o.ridge === 'z' ? w : d) * 0.55;
  const faces = o.faces ?? {};
  const gableOn = (face) => (o.ridge === 'z' ? (face === 'front' || face === 'back') : (face === 'left' || face === 'right'));
  const faceDefs = {
    front: { m: T(0, 0, d / 2), len: w }, back: { m: T(0, 0, -d / 2, Math.PI), len: w },
    left: { m: T(-w / 2, 0, 0, -Math.PI / 2), len: d - 2 * t }, right: { m: T(w / 2, 0, 0, Math.PI / 2), len: d - 2 * t },
  };
  for (const [name, f] of Object.entries(faceDefs)) {
    B.push(f.m);
    const ops = faces[name] ?? [];
    const baseH = o.base ? o.base.h : 0;
    const gab = gableOn(name) ? rise * (f.len / (o.ridge === 'z' ? w : d)) : 0;
    if (o.base) {
      const holes = ops.filter((p) => p.y < baseH - 0.05).map((p) => ({ x: p.x, y: p.y, w: p.w, h: Math.min(p.h, baseH - p.y - 0.01), arch: p.arch && p.y + p.h <= baseH }));
      B.add(o.base.key, wallGeo(f.len, baseH + 0.8, t, holes.map((h) => ({ ...h, y: h.y + 0.8 }))), o.base.col, T(0, -0.8, 0));
      const up = ops.filter((p) => p.y >= baseH - 0.05).map((p) => ({ ...p, y: p.y - baseH }));
      B.add(o.wallKey, wallGeo(f.len, H - baseH, t, up, gab), o.wallCol, T(0, baseH, 0));
      B.add('trim', boxM(f.len + 0.02, 0.14, 0.08), PAL.stoneWarm, T(0, baseH, 0.03));
    } else {
      const y0 = o.y0 ?? -0.8;
      B.add(o.wallKey, wallGeo(f.len, H - y0, t, ops.map((p) => ({ ...p, y: p.y - y0 })), gab), o.wallCol, T(0, y0, 0));
      if (o.plinth !== false && y0 < 0.2) B.add('stone', boxM(f.len + 0.02, 0.55, 0.06), PAL.stoneGray, T(0, 0.12, 0.02));
    }
    if (o.string) for (const sy of o.string) B.add('trim', boxM(f.len + 0.02, 0.1, 0.06), PAL.stoneWarm, T(0, sy, 0.025));
    // cornice under the eaves (not on gable faces)
    if (!gableOn(name) && !o.noRoof) { B.add('trim', boxM(f.len + 0.1, 0.16, 0.14), PAL.stoneWarm, T(0, H - 0.08, 0.05)); B.add('trim', boxM(f.len + 0.16, 0.08, 0.22), PAL.stoneWarm, T(0, H + 0.0, 0.08)); }
    for (const p of ops) {
      if (p.type === 'door') addDoor(B, p, p.st);
      else if (p.type === 'win') addWindow(B, p, p.st);
    }
    B.pop();
  }
  if (o.quoins) {
    const qc = o.quoins === true ? PAL.stoneWarm : o.quoins;
    quoins(B, w / 2 + 0.02, d / 2 + 0.02, o.base ? o.base.h : 0.3, H, [-1, 0], [0, -1], qc);
    quoins(B, -w / 2 - 0.02, d / 2 + 0.02, o.base ? o.base.h : 0.3, H, [1, 0], [0, -1], qc);
    quoins(B, w / 2 + 0.02, -d / 2 - 0.02, o.base ? o.base.h : 0.3, H, [-1, 0], [0, 1], qc);
    quoins(B, -w / 2 - 0.02, -d / 2 - 0.02, o.base ? o.base.h : 0.3, H, [1, 0], [0, 1], qc);
  }
  if (o.noRoof) return null;
  // roof
  const r = o.roof; const ohE = r.ohE ?? 0.55, ohG = r.ohG ?? 0.4;
  let roofH;
  if (o.ridge === 'z') {
    B.push(T(0, 0, 0, Math.PI / 2));
    const slope = rise / (w / 2);
    roofH = gableRoof(B, { L: d + 2 * ohG, half: w / 2 + ohE, eaveY: H + 0.06 - ohE * slope, ridgeY: H + rise + 0.18, key: r.key, col: r.col, sag: r.sag, rsag: r.rsag, ohE, barge: r.barge });
    B.pop();
    const f = roofH; roofH = (x, z) => f(-z, x);
  } else {
    const slope = rise / (d / 2);
    roofH = gableRoof(B, { L: w + 2 * ohG, half: d / 2 + ohE, eaveY: H + 0.06 - ohE * slope, ridgeY: H + rise + 0.18, key: r.key, col: r.col, sag: r.sag, rsag: r.rsag, ohE, barge: r.barge });
  }
  // attic floor plate to keep the inside dark & closed
  B.add('wood', boxM(w - 0.1, 0.1, d - 0.1), '#4a3a2e', T(0, H - 0.05, 0));
  return roofH;
}

/* window-row helper: n windows centred across a facade of length len */
function row(n, len, y, w, h, st, extra = {}) {
  const out = []; const gap = len / n;
  for (let i = 0; i < n; i++) out.push({ type: 'win', x: -len / 2 + gap * (i + 0.5), y, w, h, st, ...extra });
  return out;
}

/* =====================  the buildings of Windvale  ===================== */
function rod(B, key, a, b, r, col = 0xffffff, seg = 6) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  const m = new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(0.5), new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), dir.clone().normalize()), V3(1, 1, 1));
  B.add(key, cylM(r, r, len, seg), col, m);
}
const faceM = (w, d, f) => ({ front: T(0, 0, d / 2), back: T(0, 0, -d / 2, Math.PI), left: T(-w / 2, 0, 0, -Math.PI / 2), right: T(w / 2, 0, 0, Math.PI / 2) })[f];
function ivyOn(B, m, x0, x1, y0, y1, density = 1) { ANCHORS.ivy.push({ m: worldOf(B, m), x0, x1, y0, y1, density }); }

function dormer(B, roofH, x, zFront, w = 1.5, h = 1.7, o = {}) {
  const yb = roofH(x, zFront) - 0.15; const dd = 2.2;
  B.push(T(x, yb, zFront));
  B.add(o.wallKey ?? 'plaster', wallGeo(w, h, 0.14, [{ x: 0, y: 0.35, w: w * 0.5, h: h * 0.62 }], w * 0.5), o.wallCol ?? PAL.cream, T(0, 0, 0));
  addWindow(B, { x: 0, y: 0.35, w: w * 0.5, h: h * 0.62 }, { inset: 0.07, sill: false, panes: [2, 2], frame: PAL.frame });
  for (const s of [-1, 1]) B.add(o.wallKey ?? 'plaster', boxM(0.12, h, dd), o.wallCol ?? PAL.cream, T(s * (w / 2 - 0.06), h / 2, -dd / 2));
  B.push(T(0, 0, -dd / 2 + 0.25, Math.PI / 2));
  gableRoof(B, { L: dd + 0.5, half: w / 2 + 0.28, eaveY: h - 0.1, ridgeY: h + w * 0.5 + 0.12, key: o.key ?? 'roof', col: o.col ?? PAL.terracotta, sag: 0.04, rsag: 0.01, ohE: 0.28, t: 0.1 });
  B.pop(); B.pop();
}

/* half-timber framing on a face (outer face z=0) */
function timbers(B, len, y0, y1, floors, wins, gable = 0, col = PAL.timber) {
  const tb = 0.15, dz = 0.03;
  const hb = (y, xa = -len / 2, xb = len / 2) => B.add('wood', boxM(xb - xa, tb, 0.07), jitter(col, 0.01, 0.04, 0.04), T((xa + xb) / 2, y, dz));
  const vb = (x, ya, yb) => B.add('wood', boxM(tb, yb - ya, 0.07), jitter(col, 0.01, 0.04, 0.04), T(x, (ya + yb) / 2, dz));
  const db = (xa, ya, xb, yb) => { const L = Math.hypot(xb - xa, yb - ya); B.add('wood', boxM(L, tb * 0.85, 0.06), jitter(col, 0.01, 0.04, 0.04), T((xa + xb) / 2, (ya + yb) / 2, dz + 0.005, 0, 0, Math.atan2(yb - ya, xb - xa))); };
  const levels = [y0, ...floors, y1];
  levels.forEach((y, i) => hb(i === 0 ? y + tb / 2 : i === levels.length - 1 ? y - tb / 2 : y));
  for (let f = 0; f < levels.length - 1; f++) {
    const ya = levels[f], yb = levels[f + 1];
    const ws = wins.filter((w) => w.y >= ya && w.y < yb).sort((a, b) => a.x - b.x);
    const xs = [-len / 2 + tb / 2];
    for (const w of ws) xs.push(w.x - w.w / 2 - 0.12, w.x + w.w / 2 + 0.12);
    xs.push(len / 2 - tb / 2);
    xs.forEach((x) => vb(x, ya, yb));
    for (const w of ws) { hb(w.y - 0.1, w.x - w.w / 2 - 0.12, w.x + w.w / 2 + 0.12); hb(w.y + w.h + 0.1, w.x - w.w / 2 - 0.12, w.x + w.w / 2 + 0.12); }
    for (let i = 0; i < xs.length - 1; i++) {
      const xa = xs[i], xb = xs[i + 1]; if (xb - xa < 0.5) continue;
      const inWin = ws.some((w) => w.x > xa && w.x < xb); if (inWin) continue;
      if (xb - xa > 1.6) { const xm = (xa + xb) / 2; vb(xm, ya, yb); db(xa, ya, xm, yb); db(xb, ya, xm, yb); }
      else if ((i + f) % 2) db(xa, ya, xb, yb); else db(xa, yb, xb, ya);
    }
  }
  if (gable > 0) {
    const yTop = y1 + gable;
    db(-len / 2, y1, 0, yTop); db(len / 2, y1, 0, yTop);
    vb(0, y1, yTop - 0.3);
    const yc = y1 + gable * 0.45; const half = len / 2 * (1 - 0.45);
    hb(yc, -half, half);
    db(-half * 0.55, y1, 0, yc); db(half * 0.55, y1, 0, yc);
  }
}

function buildTower(B) {
  const R = 3.1, H = 15.6; B.push(T(-9.9, 0, -12.3));

  B.add('stone', cylM(R + 0.04, R + 0.42, 1.8, 44), C('#d8c8aa'), T(0, 0.1, 0));

  for (const y of [5.4, 10.6]) B.add('trim', cylM(R + 0.09, R + 0.09, 0.18, 44), C('#e6dac2'), T(0, y, 0));
  for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; B.add('trim', boxM(0.22, 0.5, 0.34), C('#ddd0b6'), T(Math.sin(a) * (R + 0.12), H - 0.25, Math.cos(a) * (R + 0.12), a)); }
  B.add('trim', cylM(R + 0.36, R + 0.36, 0.14, 44), C('#e8dcc4'), T(0, H + 0.05, 0));
  B.add('plaster', cylM(R + 0.3, R + 0.3, 2.1, 44), C('#f4e7cc'), T(0, H + 1.12, 0));
  B.add('trim', cylM(R + 0.4, R + 0.4, 0.16, 44), C('#e8dcc4'), T(0, H + 2.2, 0));
  coneRoof(B, { R: R + 1.05, y0: H + 2.25, H: 7.4, key: 'slate', col: '#6b8399', flare: 1.55 });
  ANCHORS.vane = V3(0, H + 2.25 + 7.4 + 1.25, 0).applyMatrix4(B.top);
  // tower windows: inserts facing radially outward
  const insert = (a, y, w, h, R0, big = false) => {
    B.push(T(Math.sin(a) * R0, 0, Math.cos(a) * R0, a));
    const fc = C('#e7dbc3');
    B.add('trim', boxM(0.16, h + 0.1, 0.3), fc, T(-w / 2 - 0.08, y + h / 2, 0.05)); B.add('trim', boxM(0.16, h + 0.1, 0.3), fc, T(w / 2 + 0.08, y + h / 2, 0.05));
    B.add('trim', boxM(w + 0.4, 0.12, 0.38), fc, T(0, y - 0.05, 0.08));
    B.add('trim', archRingGeo(w / 2, w / 2 + 0.17, 0.3, 10), fc, T(0, y + h, 0.2));
    B.add('glass', new THREE.PlaneGeometry(w, h + w / 2), '#ffffff', T(0, y + (h + w / 2) / 2, 0.075));
    B.add('wood', boxM(0.035, h + w / 2, 0.04), PAL.frame, T(0, y + (h + w / 2) / 2, 0.09));
    if (big) {
      B.add('trim', boxM(w + 0.9, 0.12, 0.85), C('#ddd0b6'), T(0, y - 0.12, 0.4));
      for (const s of [-1, 1]) B.add('trim', boxM(0.16, 0.42, 0.62), C('#d6c8ac'), T(s * (w / 2 + 0.2), y - 0.42, 0.3));
      for (let i = 0; i <= 10; i++) { const x = -(w + 0.8) / 2 + i * (w + 0.8) / 10; B.add('metal', cylM(0.014, 0.014, 0.85, 4), 0xffffff, T(x, y + 0.36, 0.8)); }
      B.add('metal', boxM(w + 0.85, 0.035, 0.035), 0xffffff, T(0, y + 0.8, 0.8));
      for (const s of [-1, 1]) B.add('metal', boxM(0.035, 0.035, 0.7), 0xffffff, T(s * (w + 0.82) / 2, y + 0.8, 0.45));
      ANCHORS.flowerBoxes.push({ m: worldOf(B, T(0, y + 0.82, 0.74)), w: w + 0.6, d: 0.14, kind: 'trail' });
    }
    B.pop();
  };

/* =====================  sky dome, clouds, river shader (GLSL) with planar reflection  ===================== */
const SKY = {
  zenith: C('#4a8bd0'), mid: C('#93bfe6'), horizon: C('#e4e7e0'), low: C('#d4dcdc'), glow: C('#ffd9a0'),
};
const FOG_COLOR = C('#d3dfe4');

function skyMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: { uSun: U.sunDir, uZen: { value: SKY.zenith }, uMid: { value: SKY.mid }, uHor: { value: SKY.horizon }, uLow: { value: SKY.low }, uGlow: { value: SKY.glow } },
    vertexShader: /* glsl */`varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
    fragmentShader: /* glsl */`
      uniform vec3 uSun, uZen, uMid, uHor, uLow, uGlow; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.22, h));
        col = mix(col, uZen, smoothstep(0.18, 0.85, h));
        float s = max(dot(d, uSun), 0.0);
        col += uGlow * (pow(s, 5.0) * 0.32 + pow(s, 48.0) * 0.5) * smoothstep(-0.1, 0.2, h + 0.1);
        col += vec3(1.0, 0.96, 0.85) * smoothstep(0.9993, 0.9997, s) * 6.0;
        col = mix(col, uLow, smoothstep(0.0, -0.08, h));
        gl_FragColor = vec4(col, 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false,
  });
}
function buildSky() {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 24), skyMaterial());
  sky.frustumCulled = false; sky.renderOrder = -10; sky.name = 'sky';
  sky.onBeforeRender = (r, s, cam) => { sky.position.copy(cam.position); sky.updateMatrixWorld(); };
  return sky;
}

/* painterly cumulus: camera-facing sprites far away, drifting very slowly */
const CLOUDS = [];
function buildClouds() {
  const g = new THREE.Group(); g.name = 'clouds';

    [-0.55, 0.13, 2600, 900], [-0.18, 0.2, 3000, 1150], [0.12, 0.11, 2800, 760], [0.42, 0.17, 3100, 1000], [0.7, 0.09, 2500, 700],
    [-0.9, 0.08, 2700, 620], [1.05, 0.14, 2900, 820], [-0.35, 0.33, 3300, 900], [0.3, 0.36, 3400, 700], [2.2, 0.12, 2800, 900], [-2.0, 0.1, 2800, 800], [3.0, 0.15, 3000, 900],
    [-0.05, 0.055, 4200, 900], [0.28, 0.05, 4400, 1100], [0.58, 0.06, 4300, 800], [-0.42, 0.06, 4300, 1000], [-0.7, 0.045, 4500, 900], [0.9, 0.05, 4400, 900],

    const s = new THREE.Sprite(mat);

    s.position.set(cam.position.x + Math.cos(a) * s.userData.dist, Math.sin(s.userData.el) * s.userData.dist, cam.position.z + Math.sin(a) * s.userData.dist);
  }
}

/* ---------------- river ---------------- */
const REFL = { rt: null, cam: new THREE.PerspectiveCamera(), texMat: new THREE.Matrix4(), scale: LOW ? 0.35 : 0.45 };
const MAX_RIPPLES = 40;
const SHORE_BOX = { x0: -40, z0: -560, sx: 200, sz: 680 };
let WATER = null;

function bakeShore() {
  const W = 256, H = 768; const data = new Uint8Array(W * H * 4);
  const t = TERRACE, d = DOCK;
  const rectDist = (x, z, x0, x1, z0, z1) => { const dx = Math.max(x0 - x, 0, x - x1), dz = Math.max(z0 - z, 0, z - z1); return Math.hypot(dx, dz); };
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const x = SHORE_BOX.x0 + (i + 0.5) / W * SHORE_BOX.sx, z = SHORE_BOX.z0 + (j + 0.5) / H * SHORE_BOX.sz;
    const r = riverAt(z); const sd = Math.abs(x - r.cx) - r.w; const natural = !(x < r.cx && isQuay(z));
    let dist = Math.max(0, -sd) + (natural ? 2.6 : 0);
    if (z > t.z0 - 30 && z < t.z1 + 30) dist = Math.min(dist, rectDist(x, z, quayX(z) - 1, t.x1, t.z0, t.z1));
    dist = Math.min(dist, rectDist(x, z, quayX(z) - 1, quayX(z) + d.len, d.z0, d.z1) + 1.2);
    const k = (j * W + i) * 4; data[k] = clamp(dist / 24 * 255, 0, 255); data[k + 1] = data[k + 2] = 0; data[k + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat); tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  return tex;
}

function buildWater() {
  REFL.rt = new THREE.WebGLRenderTarget(512, 512, { type: THREE.HalfFloatType, samples: 0 });
  const ripples = []; for (let i = 0; i < MAX_RIPPLES; i++) ripples.push(new THREE.Vector4(0, 0, 0, 0));
  const mat = new THREE.ShaderMaterial({
    fog: true,
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
      uTime: { value: 0 }, tRefl: { value: REFL.rt.texture }, textureMatrix: { value: REFL.texMat }, tShore: { value: null },
      uShoreBox: { value: new THREE.Vector4(SHORE_BOX.x0, SHORE_BOX.z0, SHORE_BOX.sx, SHORE_BOX.sz) },
      uSunDir: { value: SUN_DIR }, uSunCol: { value: C('#fff1d8').multiplyScalar(3.2) },
      uDeep: { value: C('#1f5c66') }, uShallow: { value: C('#4f8f82') }, uSky: { value: C('#9cc3df') },
      uRipples: { value: ripples }, uRippleCount: { value: 0 },
    }]),
    vertexShader: /* glsl */`
      uniform mat4 textureMatrix; varying vec4 vRefl; varying vec3 vWPos;
      #include <common>
      #include <fog_pars_vertex>
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz; vRefl = textureMatrix * wp;
        vec4 mvPosition = viewMatrix * wp; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: /* glsl */`
      uniform float uTime; uniform sampler2D tRefl, tShore; uniform vec4 uShoreBox;
      uniform vec3 uSunDir, uSunCol, uDeep, uShallow, uSky;
      uniform vec4 uRipples[${MAX_RIPPLES}]; uniform int uRippleCount;
      varying vec4 vRefl; varying vec3 vWPos;
      #include <common>
      #include <fog_pars_fragment>
      ${GLSL_NOISE}
      float waveH(vec2 p, float fine){
        float t = uTime; float h = 0.0;
        h += wv_noise(vec2(p.x * 0.42, (p.y - t * 0.55) * 0.2)) * 0.5;
        h += wv_noise(mat2(0.8, -0.6, 0.6, 0.8) * p * 1.05 + vec2(0.0, -t * 0.72)) * 0.26;
        h += wv_noise(mat2(0.6, 0.8, -0.8, 0.6) * p * 2.7 + vec2(t * 0.16, -t * 0.95)) * 0.12 * fine;
        h += wv_noise(p * vec2(6.0, 4.5) + vec2(-t * 0.25, -t * 1.25)) * 0.05 * fine;
        h += wv_noise(p * 14.0 + vec2(t * 0.35, -t * 1.6)) * 0.022 * fine * fine;
        return h;
      }
      void main(){
        vec3 toCam = cameraPosition - vWPos; float dist = length(toCam); vec3 V = toCam / dist;
        vec2 p = vWPos.xz;
        vec2 suv = (p - uShoreBox.xy) / uShoreBox.zw;
        float shore = (suv.x > 0.0 && suv.x < 1.0 && suv.y > 0.0 && suv.y < 1.0) ? texture2D(tShore, suv).r * 24.0 : 24.0;
        float fine = 1.0 - smoothstep(30.0, 260.0, dist);
        float e = 0.05 + dist * 0.0025;
        float h0 = waveH(p, fine), hx = waveH(p + vec2(e, 0.0), fine), hz = waveH(p + vec2(0.0, e), fine);
        float str = 0.32 * mix(0.55, 1.0, smoothstep(0.0, 4.0, shore));
        vec2 grad = vec2(hx - h0, hz - h0) / e * str;
        // local ripples (posts, boats, waterfall) and downstream wakes
        float ringFoam = 0.0, wake = 0.0;
        for (int i = 0; i < ${MAX_RIPPLES}; i++) {
          if (i >= uRippleCount) break;
          vec4 r = uRipples[i]; vec2 d = p - r.xy; float L = length(d);
          float reach = r.z + 3.0 + r.w * 5.0;
          if (L > reach) continue;
          float env = exp(-max(L - r.z, 0.0) * (1.6 / (0.6 + r.w))) * smoothstep(r.z * 0.7, r.z, L);
          float ph = L * 6.5 - uTime * 2.4 + float(i) * 1.7;
          grad += d / max(L, 1e-3) * cos(ph) * 0.22 * env * min(r.w, 1.2);
          ringFoam += smoothstep(0.75, 1.0, sin(ph)) * env * 0.35 * min(r.w, 1.0) + exp(-max(L - r.z, 0.0) * 3.0) * smoothstep(r.z * 0.7, r.z, L) * 0.35;
          if (r.w > 2.0) ringFoam += exp(-L / (r.z * 0.9)) * 1.4;
          float down = d.y;
          if (down > 0.0 && r.w <= 2.0) { float wk = exp(-d.x * d.x / (0.04 + down * 0.05)) * exp(-down * 0.35);
            wake += wk; grad.x += sin(down * 7.0 - uTime * 3.5) * wk * 0.12; }
        }
        vec3 N = normalize(vec3(-grad.x, 1.0, -grad.y));
        // reflection (planar, distorted by the waves)
        vec4 rc = vRefl; rc.xy += N.xz * 0.045 * rc.w * (1.0 - smoothstep(60.0, 600.0, dist) * 0.6);
        vec3 refl = texture2DProj(tRefl, rc).rgb;
        // water body
        float depthF = smoothstep(0.2, 10.0, shore);
        float NL = max(dot(N, uSunDir), 0.0);
        vec3 body = mix(uShallow, uDeep, depthF) * (0.45 + 0.55 * NL) + uSky * 0.05;
        float NV = max(dot(N, V), 0.0);
        float fres = 0.03 + 0.97 * pow(1.0 - NV, 5.0);
        fres = clamp(fres * 1.25 + 0.12, 0.0, 0.96);
        vec3 col = mix(body, refl * 0.96, fres);
        // sun
        vec3 H = normalize(uSunDir + V); float NH = max(dot(N, H), 0.0);
        col += uSunCol * (pow(NH, 900.0) * 5.0 + pow(NH, 90.0) * 0.06);
        float sk = wv_noise(p * 6.0 + vec2(0.0, -uTime * 0.9)) * wv_noise(p * 8.7 + vec2(uTime * 0.5, -uTime * 0.35));
        col += uSunCol * smoothstep(0.62, 0.86, sk) * 0.22 * (1.0 - smoothstep(20.0, 200.0, dist)) * (0.4 + 0.6 * fres);
        // shore lapping + foam
        float fn = wv_fbm(p * 1.4 + vec2(0.0, -uTime * 0.35));
        float lap = sin(shore * 4.5 - uTime * 1.5 + fn * 5.0) * 0.5 + 0.5;
        float foam = smoothstep(0.9, 0.0, shore) * (0.35 + 0.65 * fn) + smoothstep(0.75, 1.0, lap) * smoothstep(2.6, 0.3, shore) * 0.45;
        foam += ringFoam * (0.4 + 0.6 * fn) + wake * 0.25 * fn;
        col = mix(col, vec3(0.86, 0.9, 0.88) * (0.55 + 0.45 * NL) + uSky * 0.1, clamp(foam, 0.0, 1.0) * 0.6);
        gl_FragColor = vec4(col, 1.0);
        #include <fog_fragment>
      }`,
  });
  // UniformsUtils.merge clones values: re-link the shared objects
  Object.assign(mat.uniforms, { tShore: { value: bakeShore() }, tRefl: { value: REFL.rt.texture }, textureMatrix: { value: REFL.texMat }, uSunDir: { value: SUN_DIR } });
  const geo = new THREE.PlaneGeometry(1, 1, 1, 1); geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, mat);
  // cover the whole river: a long strip following the valley
  mesh.scale.set(560, 1, 3800); mesh.position.set(110, WATER_Y, -1500);
  mesh.name = 'water'; mesh.receiveShadow = false; mesh.frustumCulled = false;
  WATER = mesh;
  return mesh;
}
function setRipples() {
  const arr = WATER.material.uniforms.uRipples.value; const n = Math.min(MAX_RIPPLES, RIPPLES.length);
  for (let i = 0; i < n; i++) { const r = RIPPLES[i]; arr[i].set(r.x, r.z, r.r, r.s); }
  WATER.material.uniforms.uRippleCount.value = n;
}

const _rp = { n: V3(0, 1, 0), pos: V3(), cw: V3(), rot: new THREE.Matrix4(), look: V3(), view: V3(), target: V3(), plane: new THREE.Plane(), clip: new THREE.Vector4(), q: new THREE.Vector4() };
function renderReflection(renderer, scene, camera) {
  const p = _rp; const vc = REFL.cam;
  p.pos.set(0, WATER_Y, 0); p.cw.setFromMatrixPosition(camera.matrixWorld);
  p.view.subVectors(p.pos, p.cw); p.view.set(p.cw.x, 2 * WATER_Y - p.cw.y, p.cw.z);
  p.rot.extractRotation(camera.matrixWorld); p.look.set(0, 0, -1).applyMatrix4(p.rot).add(p.cw);
  p.target.set(p.look.x, 2 * WATER_Y - p.look.y, p.look.z);
  vc.position.copy(p.view); vc.up.set(0, 1, 0).applyMatrix4(p.rot); vc.up.reflect(p.n);
  vc.lookAt(p.target); vc.far = camera.far; vc.near = camera.near; vc.fov = camera.fov; vc.aspect = camera.aspect;
  vc.updateMatrixWorld(); vc.projectionMatrix.copy(camera.projectionMatrix);
  REFL.texMat.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);
  REFL.texMat.multiply(vc.projectionMatrix).multiply(vc.matrixWorldInverse);
  // oblique near plane = water plane
  p.plane.setFromNormalAndCoplanarPoint(p.n, p.pos).applyMatrix4(vc.matrixWorldInverse);

}

function buildFountainWater(scene) {
  if (!ANCHORS.fountain) return;
  const f = ANCHORS.fountain;
  const w = new THREE.Mesh(new THREE.CircleGeometry(1.3, 32), new THREE.MeshStandardMaterial({ color: 0x5f9a96, roughness: 0.04, metalness: 0.2, envMapIntensity: 1.6 }));
  w.rotation.x = -Math.PI / 2; w.position.set(f.x, 0.58, f.z); scene.add(w);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU + 0.4; const pts = [];
    for (let k = 0; k <= 10; k++) { const t = k / 10; const r = 0.1 + t * 0.55; pts.push(V3(f.x + Math.cos(a) * r, 1.72 + 0.18 * Math.sin(Math.PI * t * 0.6) - t * t * 0.38, f.z + Math.sin(a) * r)); }
    const m = new THREE.Mesh(taperTube(new THREE.CatmullRomCurve3(pts), 16, 5, (t) => 0.025 + 0.01 * t), FALLS.mat); m.renderOrder = 2; scene.add(m);
    const drop = []; for (let k = 0; k <= 6; k++) { const t = k / 6; drop.push(V3(f.x + Math.cos(a) * (0.66 + t * 0.12), 1.34 - t * 0.74, f.z + Math.sin(a) * (0.66 + t * 0.12))); }
    const m2 = new THREE.Mesh(taperTube(new THREE.CatmullRomCurve3(drop), 8, 5, () => 0.03), FALLS.mat); m2.renderOrder = 2; scene.add(m2);
  }
}

function buildLife(scene) {
  buildFountainWater(scene);

  buildBoat(scene, xq + 5.2, DOCK.z0 - 1.25, Math.PI / 2 + 0.06, '#3f6f9a');

  buildBoat(scene, xq + 14.8, DOCK.z0 - 1.6, Math.PI / 2 + 0.25, '#4f8a68', { L: 3.6, B: 1.3 });
  buildBoat(scene, 36, -42, 0.5, '#e9e2d2', { L: 4.8, B: 1.6, D: 0.65, sail: true, stripe: '#3f6f9a' });
  UPDATERS.push(animateBoats);
  buildButterflies(scene); buildBirds(scene); buildLaundry(scene); buildSignAndVane(scene);

}

// 2D hand-drawn characters for Windvale: an ink + cel-colour drawing engine, a 3D pose skeleton

// Everything is drawn with Canvas 2D from curves placed by hand; the 3D skeleton only places

    collar: '#fbf8f1', collarS: '#d3d9e4', sock: '#fbf8f1', sockS: '#d3d9e4', shoe: '#5e3426', shoeS: '#3f2219',

 * They are 2D drawings (G2D above), redrawn every frame into small canvases and shown on
 * camera-facing cards. The front view is traced from the user's own reference drawing (curves

 * angle with the 3D skeleton. Her legs are a separate card at their true depth so the parapet hides them correctly.

    vertexShader: /* glsl */`
      uniform vec3 uAnchor; uniform vec4 uRect; uniform float uBias; varying vec2 vUv;
      #include <fog_pars_vertex>

  await stage(66, '正在种下花草……');
  buildIvy(B); mark('ivy');
  const hero = makeTree(B, V3(-10.8, terrainH(-10.8, 35), 35), { seed: 3, crownY: 11.6, crownR: 6.6, crownRY: 3.4, trunkH: 6.4, trunkR: 0.6, lean: [1.8, -1.2], limbs: 4, depth: 3, fill: 18, cards: 16, card: 1.9, clumpR: 1.85, spread: 1.0, up: 0.12, leafCol: '#9fc46c', phase: 0.3 });
  makeTree(B, V3(5.8, 0, -23.6), { seed: 11, scale: 0.5, crownY: 5.4, crownR: 3.4, crownRY: 2.4, trunkH: 2.6, trunkR: 0.34, limbs: 3, depth: 2, fill: 8, cards: 13, card: 1.9, leafCol: '#93b964' });
  makeTree(B, V3(-31, terrainH(-31, 30), 30), { seed: 21, scale: 0.9, crownY: 8, crownR: 5.5, limbs: 3, depth: 2, fill: 10, cards: 13, card: 1.9, leafCol: '#8fb862' });
  makeCypress(B, V3(-17.5, 0, -15.5), 9.5, 1.3, 5); makeCypress(B, V3(-18.5, 0, -8.8), 7.5, 1.1, 6); makeCypress(B, V3(-21, 0, -35), 8.5, 1.2, 7);
  seed(1234);
  for (const [x, z] of [[-34, -60], [-16, -100], [6, -94], [-50, -44], [-30, -84], [-56, -20], [-48, 14], [-38, 44], [2, -106], [-62, -70]]) { const y = terrainH(x, z); makeTree(B, V3(x, y, z), { seed: Math.abs(x * 7 + z), scale: R(0.7, 1.0), crownY: 8, crownR: 5, limbs: 3, depth: 2, fill: 8, cards: 12, card: 2.0, leafCol: pick(['#8fb862', '#9cc06a', '#86ae5a']) }); }
  mark('trees'); scene.add(B.build(MAT)); mark('merge town');
  precompile(); // start compiling while the rest is generated
  populatePlants(); mark('populate plants');
  await stage(76, '正在让山坡长出森林……');
  scene.add(buildForest(scene)); mark('forest');
  const FB = new Batch(); buildCastle(FB); buildViaduct(FB);
  rocks(FB, riverAt(FALL_Z).cx + riverAt(FALL_Z).w + 2, FALL_Z + 10, 6, 7, 2.6); rocks(FB, riverAt(FALL_Z).cx + riverAt(FALL_Z).w + 14, FALL_Z + 6, 5, 6, 3);
  rocks(FB, riverAt(VIADUCT_Z).cx - riverAt(VIADUCT_Z).w - 6, VIADUCT_Z + 12, 6, 10, 3);
  buildWaterfall(scene, FB); mark('castle+viaduct+falls');
  scene.add(FB.build(MAT, { cast: false }));
  buildPlantMeshes(scene); mark('plant meshes');
  await stage(86, '正在唤醒小镇……');
  buildLife(scene);
  scene.add(buildBalusters());
  scene.add(buildWater()); mark('life+water');

  if (typeof window.__extraBuild === 'function') await window.__extraBuild(scene);
  await stage(96, '等风来……');
  setRipples();

  if (STILL) await CHARACTERS.ready; // screenshots & film wait for the girl and the cat; live pages show them as soon as they are sculpted
  await stage(98, '等风来……');
  await precompile(); mark('compile shaders');
  // post-processing (phones skip bloom)
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  if (!LOW) composer.addPass(new UnrealBloomPass(new THREE.Vector2(size.x, size.y), 0.14, 0.55, 0.92));
  composer.addPass(new OutputPass());
  const grade = new ShaderPass(GradeShader); composer.addPass(grade);

  // camera + controls
  camera.position.copy(defaultPos());
  const controls = new OrbitControls(camera, canvasEl);
  controls.target.copy(defaultTarget());
  Object.assign(controls, { enableDamping: true, dampingFactor: 0.07, minDistance: 3, maxDistance: 190, maxPolarAngle: Math.PI * 0.495, screenSpacePanning: true, rotateSpeed: 0.55, zoomSpeed: 0.8, panSpeed: 0.7 });
  if (PARAMS.get('cam')) { const v = PARAMS.get('cam').split(',').map(Number); camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); }
  controls.update();

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    // narrow / portrait screens: widen the vertical FOV so the town still fits across
    camera.fov = camera.aspect < 1.5 ? Math.min(78, DEFAULT_VIEW.fov * Math.pow(1.5 / camera.aspect, 0.72)) : DEFAULT_VIEW.fov;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(pixelRatio); renderer.setSize(innerWidth, innerHeight, false);
    renderer.getDrawingBufferSize(size); composer.setPixelRatio(1); composer.setSize(size.x, size.y);
    grade.uniforms.uRes.value.set(size.x, size.y);
    REFL.rt.setSize(Math.round(size.x * REFL.scale), Math.round(size.y * REFL.scale));
  }
  addEventListener('resize', resize); resize();

  // keep camera above ground / water and the target inside the valley
  function constrain() {
    const t = controls.target; t.x = clamp(t.x, -120, 160); t.z = clamp(t.z, -420, 140); t.y = clamp(t.y, -1, 60);
    const g = Math.max(terrainH(camera.position.x, camera.position.z), WATER_Y) + 1.0;
    if (camera.position.y < g) camera.position.y = g;
  }

  setupUI({ camera, controls, renderer });

  // adaptive resolution
  let acc = 0, frames = 0, lastAdj = 0;
  const clock = new THREE.Clock(); let t = STILL ? 18 : 0; let nFrames = 0;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!STILL) t += dt;
    U.time.value = t; WATER.material.uniforms.uTime.value = t; grade.uniforms.uTime.value = t; if (FALLS.mat) FALLS.mat.uniforms.uTime.value = t;
    renderer.info.reset();
    for (const u of UPDATERS) u(t, dt, camera);
    TOUR.update(dt, camera, controls);
    controls.update(); constrain();
    updateClouds(t, camera);
    renderReflection(renderer, scene, camera);
    composer.render();
    // adapt pixel ratio to keep things smooth
    acc += dt; frames++;
    if (acc > 2.5 && !STILL) {
      const ms = acc / frames * 1000; acc = 0; frames = 0;
      if (t - lastAdj > 4) {
        if (ms > 30 && pixelRatio > 0.7) { pixelRatio = Math.max(0.7, pixelRatio - 0.2); resize(); lastAdj = t; }
        else if (ms < 15 && pixelRatio < maxPR) { pixelRatio = Math.min(maxPR, pixelRatio + 0.15); resize(); lastAdj = t; }
      }
    }
    nFrames++;
    if (!(STILL && nFrames > 3)) requestAnimationFrame(frame);
  }
  if (DEBUG) window.__scene = scene;
  /* offline film rendering (used to export the tour video): render one frame at an exact time and return it as JPEG */
  if (PARAMS.has('film')) {
    grade.uniforms.uGrain.value = 0; controls.enableDamping = false;
    const out = document.createElement('canvas'); const o2 = out.getContext('2d');
    window.__renderFrame = (o) => {
      t = o.t; U.time.value = t; WATER.material.uniforms.uTime.value = t; grade.uniforms.uTime.value = t; if (FALLS.mat) FALLS.mat.uniforms.uTime.value = t;
      camera.position.set(...o.pos); controls.target.set(...o.tgt); camera.lookAt(controls.target); camera.updateMatrixWorld();
      for (const u of UPDATERS) u(t, o.dt, camera);
      updateClouds(t, camera); renderReflection(renderer, scene, camera); composer.render();
      const cv = renderer.domElement; out.width = cv.width; out.height = cv.height; o2.drawImage(cv, 0, 0);
      if (o.overlay) o.overlay(o2, out.width, out.height);
      for (const tx of o.texts || []) {
        if (tx.a <= 0.001) continue;
        if (tx.shade) { const g = o2.createRadialGradient(out.width / 2, out.height * tx.y, 0, out.width / 2, out.height * tx.y, out.width * 0.42);
          g.addColorStop(0, `rgba(36,26,16,${0.34 * tx.a})`); g.addColorStop(1, 'rgba(36,26,16,0)'); o2.fillStyle = g; o2.fillRect(0, 0, out.width, out.height); continue; }
        o2.save(); o2.globalAlpha = tx.a; o2.font = tx.font; o2.fillStyle = tx.color || '#fffaf0'; o2.textAlign = 'center'; o2.textBaseline = 'middle';
        o2.letterSpacing = tx.ls || '0px'; o2.shadowColor = 'rgba(40,28,16,0.55)'; o2.shadowBlur = tx.blur ?? 18; o2.fillText(tx.text, out.width * tx.x, out.height * tx.y); o2.restore();
      }
      return out.toDataURL('image/jpeg', 0.93);
    };
  }
  window.__setView = (p, tg) => { TOUR.stop(); camera.position.set(...p); controls.target.set(...tg); controls.update(); frame(); frame(); };
  window.__info = () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures, pr: pixelRatio });
  // warm up two frames before revealing
  mark('setup'); frame(); mark('first frame');
  await nextFrame(); await nextFrame();
  await stage(100, '');
  if (STILL) document.getElementById('loader').style.transition = 'none';
  document.getElementById('loader').classList.add('done');
  window.__ready = true;
}

/* ---------------- slow cinematic tour ---------------- */
const TOUR = {
  on: false, t: 0, shots: [
    { pos: [4.5, 5.2, 47], tgt: [-0.4, 5.6, -4], dur: 0 },
    { pos: [-2.6, 2.3, 31], tgt: [-11, 3.2, 16.5], dur: 11 },      // bakery window & awning
    { pos: [10.5, 1.9, 24], tgt: [17, 0.9, 15.4], dur: 12 },       // the girl and her cat by the water
    { pos: [24, 4.2, 4], tgt: [6, 6.5, -14], dur: 12 },             // across the water to the green-glass house
    { pos: [3, 9.5, 2], tgt: [-9.5, 15, -12.3], dur: 12 },          // up toward the round tower
    { pos: [22, 9, -24], tgt: [40, 14, -150], dur: 11 },            // out over the river
    { pos: [34, 12, -118], tgt: [74, 16, -200], dur: 13 },          // viaduct and waterfall
    { pos: [4.5, 5.2, 47], tgt: [-0.4, 5.6, -4], dur: 14 },
  ],
  start(camera, controls) {
    this.on = true; this.t = 0; this.i = 0;
    this.from = { pos: camera.position.clone(), tgt: controls.target.clone() };
    this.shots[0].pos = [camera.position.x, camera.position.y, camera.position.z];
    this.shots[0].tgt = [controls.target.x, controls.target.y, controls.target.z];
  },
  stop() { this.on = false; },
  update(dt, camera, controls) {
    if (!this.on) return;
    this.t += dt; const s = this.shots; let i = this.i + 1;
    if (i >= s.length) { this.on = false; document.getElementById('btn-tour')?.classList.remove('on'); return; }
    const k = clamp(this.t / s[i].dur, 0, 1); const e = k * k * k * (k * (k * 6 - 15) + 10);
    const a = s[i - 1], b = s[i];
    camera.position.set(lerp(a.pos[0], b.pos[0], e), lerp(a.pos[1], b.pos[1], e), lerp(a.pos[2], b.pos[2], e));
    controls.target.set(lerp(a.tgt[0], b.tgt[0], e), lerp(a.tgt[1], b.tgt[1], e), lerp(a.tgt[2], b.tgt[2], e));
    if (k >= 1) { this.i++; this.t = 0; }
  },
};

/* ---------------- UI ---------------- */
function setupUI({ camera, controls }) {
  const $ = (id) => document.getElementById(id);
  let tween = null;
  const resetView = () => {
    TOUR.stop(); $('btn-tour').classList.remove('on');
    const p0 = camera.position.clone(), t0 = controls.target.clone(), tgt = defaultTarget(), pos = defaultPos(); const start = performance.now();
    tween = () => { const k = clamp((performance.now() - start) / 1800, 0, 1); const e = 1 - Math.pow(1 - k, 3);
      camera.position.lerpVectors(p0, pos, e); controls.target.lerpVectors(t0, tgt, e); if (k >= 1) tween = null; };
  };
  UPDATERS.push(() => { if (tween) tween(); });
  const toggleTour = () => { if (TOUR.on) { TOUR.stop(); $('btn-tour').classList.remove('on'); } else { tween = null; TOUR.start(camera, controls); $('btn-tour').classList.add('on'); } };
  const toggleUI = () => document.body.classList.toggle('ui-hidden');
  const toggleFull = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); };
  $('btn-reset').onclick = resetView; $('btn-tour').onclick = toggleTour; $('btn-hide').onclick = toggleUI; $('btn-show').onclick = toggleUI; $('btn-full').onclick = toggleFull;
  controls.addEventListener('start', () => { if (TOUR.on) { TOUR.stop(); $('btn-tour').classList.remove('on'); } tween = null; });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    if (k === 'r') resetView(); else if (k === 't') toggleTour(); else if (k === 'h') toggleUI(); else if (k === 'f') toggleFull();
  });
  if (PARAMS.has('clean')) document.body.classList.add('ui-hidden');
}

main().catch((err) => {
  console.error(err);
  const el = document.getElementById('loaderr'); el.hidden = false;
  el.textContent = '场景加载失败：' + (err && err.message ? err.message : err) + '。请使用支持 WebGL2 的现代浏览器（Chrome / Edge / Safari / Firefox 最新版）打开。';
});
</script>

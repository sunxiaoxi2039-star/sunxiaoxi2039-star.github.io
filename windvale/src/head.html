<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />

<style>
  :root {
    --ink: #3b2f25;
    --ink-soft: rgba(59, 47, 37, .72);
    --paper: rgba(250, 244, 232, .78);
    --paper-strong: rgba(250, 244, 232, .92);
    --line: rgba(120, 92, 60, .22);
    --accent: #b5482f;
    --bg: #e9dcc4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3eadb; --ink-soft: rgba(243, 234, 219, .75);
      --paper: rgba(38, 32, 27, .62); --paper-strong: rgba(38, 32, 27, .86);
      --line: rgba(243, 234, 219, .18); --accent: #e58a6c; --bg: #1d1915;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3eadb; --ink-soft: rgba(243, 234, 219, .75);
    --paper: rgba(38, 32, 27, .62); --paper-strong: rgba(38, 32, 27, .86);
    --line: rgba(243, 234, 219, .18); --accent: #e58a6c; --bg: #1d1915;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  /* loading */
  #loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, #f7efdf 0%, #ead9bb 55%, #d8c09b 100%);
    transition: opacity 1.4s ease, visibility 1.4s; }
  #loader.done { opacity: 0; visibility: hidden; }
  .load-card { text-align: center; color: #4a3a2b; padding: 0 16px; }
  .load-card h1 { margin: 0; font-size: clamp(40px, 9vw, 76px); font-weight: 600; letter-spacing: .32em; text-indent: .32em; }
  .load-card .en { margin-top: 6px; font-size: 14px; letter-spacing: .6em; text-indent: .6em; opacity: .65; font-family: Georgia, serif; }
  .load-bar { width: min(260px, 70vw); height: 2px; margin: 34px auto 14px; background: rgba(74,58,43,.15); border-radius: 2px; overflow: hidden; }
  .load-bar i { display: block; height: 100%; width: 0%; background: #b5482f; transition: width .35s ease; }
  .load-msg { font-size: 13px; letter-spacing: .12em; opacity: .7; min-height: 1.4em; }
  .load-err { max-width: 520px; margin: 18px auto 0; font-size: 13px; line-height: 1.6; color: #8a2f1f; }

  /* overlay ui */
  .ui { position: fixed; z-index: 10; transition: opacity .6s ease; }
  body.ui-hidden .ui:not(.keep) { opacity: 0; pointer-events: none; }
  #title { top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); padding: 12px 18px 12px 16px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #title h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .18em; }
  #title h2 small { font-family: Georgia, serif; font-size: 12px; font-weight: 400; letter-spacing: .32em; margin-left: 8px; color: var(--ink-soft); }
  #title p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-soft); letter-spacing: .06em; }
  #bar { right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 6px; padding: 6px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #bar button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; letter-spacing: .04em;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #bar button:hover { background: var(--line); }
  #bar button.on { background: var(--accent); color: #fff8ee; }
  #bar svg { width: 16px; height: 16px; flex: 0 0 auto; }
  #hint { left: max(18px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-soft);
    background: var(--paper); border: 1px solid var(--line); padding: 7px 12px; border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #showui { right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: none; }
  body.ui-hidden #showui { display: block; }
  #showui button { appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 12px;
    padding: 7px 12px; border-radius: 10px; cursor: pointer; opacity: .55; backdrop-filter: blur(8px); }
  #showui button:hover { opacity: 1; }
  @media (max-width: 640px) {
    #title { padding: 9px 13px; } #title h2 { font-size: 18px; } #title p { display: none; }
    #hint { display: none; }
    #bar { left: 16px; right: 16px; justify-content: space-between; }
    #bar button { padding: 8px 8px; font-size: 12px; } #bar button span { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="风眠镇三维场景，可拖动旋转、滚轮缩放、右键平移"></canvas>

<div id="loader">
  <div class="load-card">
    <h1>风眠镇</h1>
    <div class="en">WINDVALE</div>
    <div class="load-bar"><i id="loadfill"></i></div>
    <div class="load-msg" id="loadmsg">正在铺石板路……</div>
    <div class="load-err" id="loaderr" hidden></div>
  </div>
</div>

<div class="ui" id="title">
  <h2>风眠镇<small>WINDVALE</small></h2>
  <p>午后三点，江风正好</p>
</div>
<div class="ui" id="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
<div class="ui" id="bar" role="toolbar" aria-label="视角控制">
  <button id="btn-reset" title="恢复默认视角 (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>默认视角</span></button>
  <button id="btn-tour" title="电影漫游 (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span>漫游</span></button>
  <button id="btn-hide" title="隐藏界面 (H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>纯净画面</span></button>
  <button id="btn-full" title="全屏 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全屏</span></button>
</div>
<div class="ui keep" id="showui"><button id="btn-show">显示界面</button></div>

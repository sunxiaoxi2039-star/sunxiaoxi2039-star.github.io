name: sync-site
# Pull the built site from the publish source listed in publish/manifest.json,
# verify every file against its sha256, commit, then ask Pages to rebuild.
on:
  push:
    branches: [main]
    paths: ['publish/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-site
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + verify files
        run: python3 .github/scripts/sync.py
      - name: Commit
        run: |
          git config user.name "radar-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "sync: $(python3 -c 'import json;print(json.load(open("publish/manifest.json")).get("note","site update"))')"
            git push
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
